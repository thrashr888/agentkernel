# One-off only. Place this file on the named throwaway ref, not on main.
name: OpenShell PR 233 one-shot canary

on:
  push:
    branches: [codex/openshell-233-live-canary-name-fix]
    paths: [.github/workflows/openshell-233-live-canary.yml]

permissions:
  contents: read

jobs:
  openshell:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CARGO_TERM_COLOR: always
      CARGO_PROFILE_DEV_DEBUG: "0"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          fetch-depth: 2
      - name: Build the PR candidate
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF" = refs/heads/codex/openshell-233-live-canary-name-fix ]]
          candidate=fc5880f1842d0e08552b800ce3ffff5f09dd4340
          [[ "$(git rev-parse HEAD^)" = "$candidate" ]]
          [[ "$(git diff --name-only "$candidate" HEAD)" = .github/workflows/openshell-233-live-canary.yml ]]
          rustup toolchain install 1.89.0 --profile minimal
          cargo +1.89.0 build --locked --no-default-features --bin agentkernel
      - name: Verify the live gateway lifecycle
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "$RUNNER_ENVIRONMENT" = github-hosted ]]
          [[ "$(uname -m)" = x86_64 ]]
          ak="$GITHUB_WORKSPACE/target/debug/agentkernel"
          root="$(mktemp -d "$RUNNER_TEMP/agentkernel-openshell.XXXXXXXX")"
          owned="openshell.ai/managed-by=openshell"
          gateway_pid=""
          gateway_started=0
          stage=bootstrap
          diagnose() {
            printf 'Failed canary stage: %s\n' "$stage"
            # Raw CLI/provider output stays private. Print fixed labels only.
            for item in control.stderr adapter.stderr gateway.log; do
              [[ -f "$root/$item" ]] || continue
              printf 'Diagnostics for %s (matched categories only):\n' "$item"
              tail -c 65536 "$root/$item" | python3 -c '
          import re
          import sys
          data = sys.stdin.read()
          patterns = {
              "registry resolution or pull": r"failed to (?:pull|resolve).*image|manifest unknown|image.*not found|toomanyrequests",
              "image reference or metadata": r"invalid (?:reference|image)|image.*inspect.*fail|invalid tag|unsupported media",
              "sandbox provisioning deadline": r"ImagePreparationTimedOut|ProvisioningTimedOut|deadline exceeded|timed out",
              "gateway authentication or TLS": r"Unauthenticated|PermissionDenied|certificate verify|tls handshake",
              "authorization or admission": r"ConfigurationInvalid|policy.*reject|policy.*invalid",
              "sandbox launch or command": r"MainProcessFailed|executable file not found|no such file or directory|exec format error",
              "Docker host networking": r"cannot reach a Linux gateway|host network.*(?:unsupported|reject)",
              "Docker host isolation support": r"Landlock|seccomp|AppArmor|operation not permitted",
              "supervisor readiness": r"supervisor.*(?:unhealthy|failed|timeout|not ready)|SandboxRuntimeUnavailable",
          }
          hits = 0
          for label, pattern in patterns.items():
              if re.search(pattern, data, re.IGNORECASE):
                  print(f"  {label}")
                  hits += 1
          if not hits:
              print("  no recognized category")
          '
            done
            if [[ "$gateway_started" = 1 ]] && [[ -n "${real_openshell:-}" ]]; then
              timeout 10s "$real_openshell" --gateway "$AGENTKERNEL_OPENSHELL_GATEWAY" \
                --workspace "$AGENTKERNEL_OPENSHELL_WORKSPACE" sandbox list --output json 2>/dev/null |
                jq -c '{sandbox_count: (.sandboxes|length),
                  phases: [.sandboxes[].phase | select(. == ("Unspecified", "Provisioning", "Ready", "Error", "Deleting", "Stopping", "Stopped", "Starting", "Completed", "Unknown"))],
                  reasons: [.sandboxes[].conditions[]?.reason | select(. == ("ImagePreparationTimedOut", "ProvisioningTimedOut", "ConfigurationInvalid", "MainProcessFailed", "SandboxRuntimeUnavailable"))]}' || true
            fi
          }
          cleanup() {
            result=$?
            trap - EXIT INT TERM
            set +e
            if [[ "$result" != 0 ]]; then diagnose; fi
            if [[ -n "$gateway_pid" ]]; then
              kill -TERM "$gateway_pid" 2>/dev/null
              for _ in {1..20}; do
                kill -0 "$gateway_pid" 2>/dev/null || break
                sleep 0.25
              done
              if kill -0 "$gateway_pid" 2>/dev/null; then
                kill -KILL "$gateway_pid"
              fi
              wait "$gateway_pid" 2>/dev/null
            fi
            if [[ "$gateway_started" = 1 ]]; then
              # Preflight rejects pre-existing OpenShell resources on this
              # dedicated GitHub-hosted VM. Never use a shared/self-hosted runner.
              containers="$(docker ps -aq --filter "label=$owned")" || result=1
              if [[ -n "$containers" ]]; then
                mapfile -t ids <<< "$containers"
                docker rm -f -v "${ids[@]}" >/dev/null || result=1
              fi
              volumes="$(docker volume ls -q --filter "label=$owned")" || result=1
              if [[ -n "$volumes" ]]; then
                mapfile -t ids <<< "$volumes"
                docker volume rm "${ids[@]}" >/dev/null || result=1
              fi
              remaining="$(docker ps -aq --filter "label=$owned")" || result=1
              [[ -z "$remaining" ]] || result=1
              remaining="$(docker volume ls -q --filter "label=$owned")" || result=1
              [[ -z "$remaining" ]] || result=1
            fi
            rm -rf -- "$root" || result=1
            exit "$result"
          }
          trap cleanup EXIT
          trap 'exit 130' INT
          trap 'exit 143' TERM
          server_version="$(docker version --format '{{.Server.Version}}')"
          server_version_major="${server_version%%.*}"
          [[ "$server_version_major" =~ ^[0-9]+$ ]]
          [[ "$server_version_major" -ge 28 ]]
          printf 'Docker Engine %s\n' "$server_version"
          listed="$(docker ps -aq --filter "label=$owned")"
          [[ -z "$listed" ]]
          listed="$(docker volume ls -q --filter "label=$owned")"
          [[ -z "$listed" ]]
          listed="$(ss -H -ltn 'sport = :17670')"
          [[ -z "$listed" ]]

          package=openshell_0.1.9-1_amd64.deb
          curl --fail --show-error --silent --location --max-time 120 \
            "https://github.com/NVIDIA/OpenShell/releases/download/v0.1.9/$package" \
            --output "$root/$package"
          printf '5d3c758fe1860625cd28b0791865b25e25912acacdc99c8ce1c6071a95ef360b  %s\n' \
            "$root/$package" | sha256sum --check
          dpkg-deb --extract "$root/$package" "$root/package"
          export PATH="$root/package/usr/bin:$PATH"
          # Isolate credentials and persisted sandbox state; no user or repo secrets.
          export HOME="$root/home" XDG_CONFIG_HOME="$root/config" XDG_STATE_HOME="$root/state"
          export OPENSHELL_LOCAL_TLS_DIR="$root/tls"
          export OPENSHELL_COMPUTE_DRIVER=docker OPENSHELL_TELEMETRY_ENABLED=false
          export OPENSHELL_SUPERVISOR_IMAGE=ghcr.io/nvidia/openshell/supervisor@sha256:f1ec231b5dbe5b6a40c33acb2ac847995aabb959a56134ef6d7d7aa4f43199d3
          export OPENSHELL_SANDBOX_RUNTIME_IMAGE=ghcr.io/nvidia/openshell/sandbox@sha256:e57d07cd6cc1fc314b80368d6b51ec6fbf825fb62cd8f081312941180846866f
          export AGENTKERNEL_OPENSHELL_GATEWAY=ak-canary
          # A brand-new gateway's default workspace is dedicated to this one test.
          export AGENTKERNEL_OPENSHELL_WORKSPACE=default
          mkdir -p "$HOME" "$XDG_CONFIG_HOME" "$XDG_STATE_HOME" "$root/work"
          cd "$root/work"
          openshell --version | grep -Fx 'openshell 0.1.9'
          openshell-gateway config preflight
          openshell-gateway generate-certs --output-dir "$OPENSHELL_LOCAL_TLS_DIR" \
            --server-san host.openshell.internal
          openshell-gateway --name "$AGENTKERNEL_OPENSHELL_GATEWAY" \
            --bind-address 127.0.0.1 --port 17670 --health-port 0 --metrics-port 0 \
            --enable-mtls-auth true >"$root/gateway.log" 2>&1 &
          gateway_pid=$!
          gateway_started=1
          for _ in {1..40}; do
            kill -0 "$gateway_pid"
            if [[ "$(ss -H -ltn 'sport = :17670' | awk '{print $4}')" = 127.0.0.1:17670 ]]; then
              break
            fi
            sleep 0.5
          done
          [[ "$(ss -H -ltn 'sport = :17670' | awk '{print $4}')" = 127.0.0.1:17670 ]]
          timeout 30s openshell gateway add https://127.0.0.1:17670 --local \
            --name "$AGENTKERNEL_OPENSHELL_GATEWAY"
          listing() {
            timeout 15s openshell --gateway "$AGENTKERNEL_OPENSHELL_GATEWAY" \
              --workspace "$AGENTKERNEL_OPENSHELL_WORKSPACE" sandbox list --output json
          }
          listing | jq -e '(.sandboxes | length) == 0 and .next_page_token == ""' >/dev/null

          # First exercise the vendor's happy path before using AgentKernel.
          real_openshell="$(command -v openshell)"
          nvidia=( "$real_openshell" --gateway "$AGENTKERNEL_OPENSHELL_GATEWAY"
            --workspace "$AGENTKERNEL_OPENSHELL_WORKSPACE" sandbox )
          base=nvcr.io/nvidia/base/ubuntu:24.04
          stage=direct-nvidia-control
          timeout 330s "${nvidia[@]}" create --name nvidia-control --from "$base" \
            --no-auto-providers --detach --output json >"$root/control.json" 2>"$root/control.stderr"
          jq -e '.name == "nvidia-control" and .phase == "Ready"' "$root/control.json" >/dev/null
          [[ "$(timeout 30s "${nvidia[@]}" exec --name nvidia-control --no-tty -- /bin/sh -c 'printf nvidia-control' 2>>"$root/control.stderr")" = nvidia-control ]]
          timeout 30s "${nvidia[@]}" delete nvidia-control >>"$root/control.json" 2>>"$root/control.stderr"
          for _ in {1..12}; do
            if listing | jq -e '(.sandboxes | length) == 0 and .next_page_token == ""' >/dev/null; then break; fi
            sleep 1
          done
          listing | jq -e '(.sandboxes | length) == 0 and .next_page_token == ""' >/dev/null
          printf 'Direct NVIDIA control passed.\n'

          stage=normalize-test-image
          # Same vendor image, but the adapter receives an explicit canonical
          # registry path and the digest actually resolved on this fresh VM.
          timeout 120s docker pull "$base" >"$root/pull.stdout" 2>>"$root/adapter.stderr"
          image="$(docker image inspect "$base" --format '{{index .RepoDigests 0}}')"
          [[ "$image" =~ ^nvcr[.]io/nvidia/base/ubuntu@sha256:[0-9a-f]{64}$ ]]
          printf 'Canary workload image: %s\n' "$image"

          # Preserve the adapter's exact argv and all exit codes. Capture the
          # vendor stderr privately because the adapter deliberately hides it.
          mkdir "$root/capture"
          export REAL_OPENSHELL="$real_openshell" CANARY_CLI_STDERR="$root/adapter.stderr"
          cat >"$root/capture/openshell" <<'WRAPPER'
          #!/usr/bin/env bash
          set -euo pipefail
          if [[ "${7:-}" == sandbox && "${8:-}" == create ]]; then
            exec "$REAL_OPENSHELL" "$@" 2>>"$CANARY_CLI_STDERR"
          fi
          exec "$REAL_OPENSHELL" "$@"
          WRAPPER
          chmod 0700 "$root/capture/openshell"
          export PATH="$root/capture:$PATH"
          stage=adapter-create
          "$ak" sandbox create openshell-smoke --backend openshell --image "$image"
          stage=adapter-lifecycle
          remote_id="$(listing | jq -er '.sandboxes | if length == 1 and .[0].phase == "Ready" then .[0].id else error("not ready") end')"
          [[ "$("$ak" exec openshell-smoke -- /bin/sh -c 'printf openshell-canary')" = openshell-canary ]]
          "$ak" sandbox stop openshell-smoke
          listing | jq -e --arg id "$remote_id" '.sandboxes | length == 1 and .[0].id == $id and .[0].phase == "Stopped"' >/dev/null
          "$ak" sandbox start openshell-smoke
          listing | jq -e --arg id "$remote_id" '.sandboxes | length == 1 and .[0].id == $id and .[0].phase == "Ready"' >/dev/null
          [[ "$("$ak" exec openshell-smoke -- /bin/sh -c 'printf openshell-canary')" = openshell-canary ]]
          "$ak" sandbox remove openshell-smoke
          listing | jq -e '(.sandboxes | length) == 0 and .next_page_token == ""' >/dev/null
          [[ ! -e "$HOME/.local/share/agentkernel/sandboxes/openshell-smoke.json" ]]
          printf 'Live create / exec / stop / start / exec / remove passed.\n'
