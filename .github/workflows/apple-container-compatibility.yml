name: Apple Containers compatibility

on:
  pull_request:
    branches: [main, codex/apple-container-1-2-modernization, codex/modernization-followups]
    paths:
      - Cargo.toml
      - Cargo.lock
      - src/backend/apple.rs
      - src/backend/mod.rs
      - tests/apple_container_smoke.rs
      - .github/workflows/apple-container-compatibility.yml
  schedule:
    - cron: "11 9 * * 5"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: "1.89"

jobs:
  compatibility:
    name: Apple Containers on macOS arm64
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apple-container
      - name: Verify supported host and CLI
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          major="$(sw_vers -productVersion | cut -d. -f1)"
          test "$major" -ge 26
          container --version
      - name: Start Apple container system
        run: container system start --enable-kernel-install
      - name: Run structured-output unit tests
        run: cargo test --locked --lib backend::apple
      - name: Run lifecycle compatibility smoke
        run: cargo test --locked --test apple_container_smoke -- --ignored --nocapture
      - name: Show container state on failure
        if: failure()
        run: container list || true
