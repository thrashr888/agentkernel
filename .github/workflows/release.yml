name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # Rust 1.89+ required for cedar-policy 4.8 (edition 2024 + let-chains)
  RUST_VERSION: "1.89"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    name: Build CLI (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agentkernel-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: agentkernel-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agentkernel-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: agentkernel-darwin-x64
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.artifact }}.tar.gz agentkernel
          mv ${{ matrix.artifact }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  desktop-app:
    name: Desktop App (${{ matrix.arch }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
        working-directory: app

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        working-directory: app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Find artifacts
        id: artifacts
        run: |
          BUNDLE_DIR="app/src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -name "*.dmg" | head -1)
          UPDATER=$(find "$BUNDLE_DIR/macos" -name "*.app.tar.gz" ! -name "*.sig" | head -1)
          SIG="${UPDATER}.sig"
          echo "dmg=$DMG" >> $GITHUB_OUTPUT
          echo "updater=$UPDATER" >> $GITHUB_OUTPUT
          echo "sig=$SIG" >> $GITHUB_OUTPUT
          echo "Found DMG: $DMG"
          echo "Found updater: $UPDATER"
          echo "Found sig: $SIG"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: desktop-dmg-${{ matrix.arch }}
          path: ${{ steps.artifacts.outputs.dmg }}

      - name: Upload updater archive
        uses: actions/upload-artifact@v4
        with:
          name: desktop-updater-${{ matrix.arch }}
          path: |
            ${{ steps.artifacts.outputs.updater }}
            ${{ steps.artifacts.outputs.sig }}

  release:
    name: Create Release
    needs: [build, desktop-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json for updater
        run: |
          VERSION=$(jq -r .version app/src-tauri/tauri.conf.json)
          TAG="${{ github.ref_name }}"
          REPO="thrashr888/agentkernel"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures
          ARM64_SIG=$(cat artifacts/desktop-updater-arm64/*.sig 2>/dev/null || echo "")
          X64_SIG=$(cat artifacts/desktop-updater-x64/*.sig 2>/dev/null || echo "")

          # Derive renamed updater filenames (must match Collect step renaming)
          ARM64_ORIG=$(basename "$(find artifacts/desktop-updater-arm64 -name '*.tar.gz' ! -name '*.sig' 2>/dev/null | head -1)" .app.tar.gz 2>/dev/null || echo "")
          X64_ORIG=$(basename "$(find artifacts/desktop-updater-x64 -name '*.tar.gz' ! -name '*.sig' 2>/dev/null | head -1)" .app.tar.gz 2>/dev/null || echo "")
          ARM64_TAR="${ARM64_ORIG}-arm64.app.tar.gz"
          X64_TAR="${X64_ORIG}-x64.app.tar.gz"

          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${ARM64_SIG}",
                "url": "${BASE_URL}/${ARM64_TAR}"
              },
              "darwin-x86_64": {
                "signature": "${X64_SIG}",
                "url": "${BASE_URL}/${X64_TAR}"
              }
            }
          }
          ENDJSON

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          # CLI binaries
          cp artifacts/agentkernel-*/*.tar.gz release-files/

          # Desktop DMGs — rename with arch suffix to avoid collision
          for arch in arm64 x64; do
            for f in artifacts/desktop-dmg-${arch}/*.dmg; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .dmg)
              cp "$f" "release-files/${base}-${arch}.dmg"
            done
          done

          # Updater archives + signatures — rename with arch suffix
          for arch in arm64 x64; do
            for f in artifacts/desktop-updater-${arch}/*.tar.gz; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .app.tar.gz)
              cp "$f" "release-files/${base}-${arch}.app.tar.gz"
            done
            for f in artifacts/desktop-updater-${arch}/*.sig; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .app.tar.gz.sig)
              cp "$f" "release-files/${base}-${arch}.app.tar.gz.sig"
            done
          done

          # Updater manifest
          cp artifacts/latest.json release-files/
          echo "Release files:"
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*

  publish-crate:
    name: Publish CLI to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Set version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/agentkernel/${VERSION}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${VERSION} already published to crates.io, skipping"
          else
            cargo publish
          fi

  helm:
    name: Publish Helm Chart
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Package chart
        run: helm package deploy/helm/agentkernel/

      - name: Push to GHCR
        run: helm push agentkernel-*.tgz oci://ghcr.io/thrashr888/charts
