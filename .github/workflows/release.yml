name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always
  # Rust 1.89+ required for cedar-policy 4.8 (edition 2024 + let-chains)
  RUST_VERSION: "1.89"

permissions:
  contents: write
  packages: write

jobs:
  test:
    name: Test Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy -- -D warnings
      - run: cargo test

  build:
    name: Build CLI (${{ matrix.artifact }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: agentkernel-linux-x64
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            artifact: agentkernel-linux-arm64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agentkernel-darwin-arm64
          - os: macos-15-intel
            target: x86_64-apple-darwin
            artifact: agentkernel-darwin-x64
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        run: |
          cd target/${{ matrix.target }}/release
          tar -czf ${{ matrix.artifact }}.tar.gz agentkernel
          mv ${{ matrix.artifact }}.tar.gz ../../../

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  desktop-app:
    name: Desktop App (${{ matrix.arch }})
    needs: test
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            arch: arm64
          - target: x86_64-apple-darwin
            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - run: npm ci
        working-directory: app

      - name: Build bundled AgentKernel sidecar
        run: cargo build --release --target ${{ matrix.target }} --bin agentkernel
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
      - name: Stage bundled AgentKernel sidecar
        run: |
          mkdir -p app/src-tauri/binaries
          cp "target/${{ matrix.target }}/release/agentkernel" \
            "app/src-tauri/binaries/agentkernel-${{ matrix.target }}"

      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}
        run: |
          set -euo pipefail

          test -n "$APPLE_CERTIFICATE" || {
            echo "::error::APPLE_CERTIFICATE is required for desktop releases" >&2
            exit 1
          }
          test -n "$APPLE_CERTIFICATE_PASSWORD" || {
            echo "::error::APPLE_CERTIFICATE_PASSWORD is required for desktop releases" >&2
            exit 1
          }
          test -n "$APPLE_SIGNING_IDENTITY" || {
            echo "::error::APPLE_SIGNING_IDENTITY is required for desktop releases" >&2
            exit 1
          }

          KEYCHAIN_PATH="$RUNNER_TEMP/agentkernel-build.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/agentkernel-certificate.p12"
          trap 'rm -f "$CERTIFICATE_PATH"' EXIT

          echo "$APPLE_CERTIFICATE" | base64 --decode > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -t 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -s "$KEYCHAIN_PATH"

          identities="$(security find-identity -v -p codesigning "$KEYCHAIN_PATH")"
          printf '%s\n' "$identities" | grep -F 'Developer ID Application:' | grep -F "$APPLE_SIGNING_IDENTITY" >/dev/null || {
            echo "::error::The imported certificate does not match APPLE_SIGNING_IDENTITY" >&2
            exit 1
          }

      - name: Set app version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' app/src-tauri/tauri.conf.json > tmp.json
          mv tmp.json app/src-tauri/tauri.conf.json

      - name: Build Tauri app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        working-directory: app
        run: npm run tauri build -- --target ${{ matrix.target }}

      - name: Find and verify desktop artifacts
        id: artifacts
        run: |
          set -euo pipefail

          BUNDLE_DIR="app/src-tauri/target/${{ matrix.target }}/release/bundle"
          DMG=$(find "$BUNDLE_DIR/dmg" -maxdepth 1 -name "*.dmg" -type f -print -quit)
          APP=$(find "$BUNDLE_DIR" -type d -name "AgentKernel.app" -print -quit)
          UPDATER=$(find "$BUNDLE_DIR/macos" -maxdepth 1 -name "*.app.tar.gz" -type f -print -quit)
          SIG="${UPDATER}.sig"

          test -s "$DMG" || { echo "::error::Desktop DMG was not produced" >&2; exit 1; }
          test -d "$APP" || { echo "::error::AgentKernel.app was not produced" >&2; exit 1; }
          test -s "$UPDATER" || { echo "::error::Updater archive was not produced" >&2; exit 1; }
          test -s "$SIG" || { echo "::error::Updater signature was not produced" >&2; exit 1; }

          echo "dmg=$DMG" >> "$GITHUB_OUTPUT"
          echo "app=$APP" >> "$GITHUB_OUTPUT"
          echo "updater=$UPDATER" >> "$GITHUB_OUTPUT"
          echo "sig=$SIG" >> "$GITHUB_OUTPUT"
          echo "Found DMG: $DMG"
          echo "Found app: $APP"
          echo "Found updater: $UPDATER"
          echo "Found sig: $SIG"

      - name: Verify Developer ID signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          APP="${{ steps.artifacts.outputs.app }}"

          codesign --verify --deep --strict --verbose=2 "$APP"
          signature_info="$(codesign -dvv "$APP" 2>&1)"
          printf '%s\n' "$signature_info" | grep -F 'Authority=Developer ID Application:' >/dev/null || {
            echo "::error::The desktop app is not signed with a Developer ID Application certificate" >&2
            exit 1
          }
          printf '%s\n' "$signature_info" | grep -F "TeamIdentifier=" >/dev/null || {
            echo "::error::The desktop app has no TeamIdentifier" >&2
            exit 1
          }

      - name: Notarize and staple DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          test -n "$APPLE_ID" || {
            echo "::error::APPLE_ID is required for desktop releases" >&2
            exit 1
          }
          test -n "$APPLE_PASSWORD" || {
            echo "::error::APPLE_PASSWORD is required for desktop releases" >&2
            exit 1
          }
          test -n "$APPLE_TEAM_ID" || {
            echo "::error::APPLE_TEAM_ID is required for desktop releases" >&2
            exit 1
          }

          DMG="${{ steps.artifacts.outputs.dmg }}"
          echo "Submitting DMG for notarization: $DMG"
          xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "$DMG"
          xcrun stapler validate "$DMG"
          spctl --assess --type open --context context:primary-signature -vv "$DMG"

      - name: Upload DMG
        uses: actions/upload-artifact@v7
        with:
          name: desktop-dmg-${{ matrix.arch }}
          path: ${{ steps.artifacts.outputs.dmg }}

      - name: Upload updater archive
        uses: actions/upload-artifact@v7
        with:
          name: desktop-updater-${{ matrix.arch }}
          path: |
            ${{ steps.artifacts.outputs.updater }}
            ${{ steps.artifacts.outputs.sig }}

  release:
    name: Create Release
    needs: [build, desktop-app]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: List artifacts
        run: find artifacts -type f | sort

      - name: Generate latest.json for updater
        run: |
          TAG="${{ github.ref_name }}"
          VERSION="${TAG#v}"
          REPO="thrashr888/agentkernel"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          # Read signatures
          ARM64_SIG=$(cat artifacts/desktop-updater-arm64/*.sig 2>/dev/null || echo "")
          X64_SIG=$(cat artifacts/desktop-updater-x64/*.sig 2>/dev/null || echo "")

          # Derive renamed updater filenames (must match Collect step renaming)
          ARM64_ORIG=$(basename "$(find artifacts/desktop-updater-arm64 -name '*.tar.gz' ! -name '*.sig' 2>/dev/null | head -1)" .app.tar.gz 2>/dev/null || echo "")
          X64_ORIG=$(basename "$(find artifacts/desktop-updater-x64 -name '*.tar.gz' ! -name '*.sig' 2>/dev/null | head -1)" .app.tar.gz 2>/dev/null || echo "")
          ARM64_TAR="${ARM64_ORIG}-arm64.app.tar.gz"
          X64_TAR="${X64_ORIG}-x64.app.tar.gz"

          BASE_URL="https://github.com/${REPO}/releases/download/${TAG}"

          cat > artifacts/latest.json << ENDJSON
          {
            "version": "${VERSION}",
            "notes": "",
            "pub_date": "${PUB_DATE}",
            "platforms": {
              "darwin-aarch64": {
                "signature": "${ARM64_SIG}",
                "url": "${BASE_URL}/${ARM64_TAR}"
              },
              "darwin-x86_64": {
                "signature": "${X64_SIG}",
                "url": "${BASE_URL}/${X64_TAR}"
              }
            }
          }
          ENDJSON

          echo "Generated latest.json:"
          cat artifacts/latest.json

      - name: Collect release files
        run: |
          mkdir -p release-files
          # CLI binaries
          cp artifacts/agentkernel-*/*.tar.gz release-files/

          # Desktop DMGs — rename with arch suffix to avoid collision
          for arch in arm64 x64; do
            for f in artifacts/desktop-dmg-${arch}/*.dmg; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .dmg)
              cp "$f" "release-files/${base}-${arch}.dmg"
            done
          done

          # Updater archives + signatures — rename with arch suffix
          for arch in arm64 x64; do
            for f in artifacts/desktop-updater-${arch}/*.tar.gz; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .app.tar.gz)
              cp "$f" "release-files/${base}-${arch}.app.tar.gz"
            done
            for f in artifacts/desktop-updater-${arch}/*.sig; do
              [ -f "$f" ] || continue
              base=$(basename "$f" .app.tar.gz.sig)
              cp "$f" "release-files/${base}-${arch}.app.tar.gz.sig"
            done
          done

          # Updater manifest
          cp artifacts/latest.json release-files/
          echo "Release files:"
          ls -la release-files/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: release-files/*

  publish-crate:
    name: Publish CLI to crates.io
    needs: test
    runs-on: ubuntu-latest
    environment: crates
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - uses: Swatinem/rust-cache@v2

      - name: Set version from tag
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          sed -i "s/^version = .*/version = \"$VERSION\"/" Cargo.toml

      - name: Authenticate with crates.io
        id: crates-auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-auth.outputs.token }}
        run: |
          VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)"/\1/')
          HTTP_STATUS=$(curl -s -o /dev/null -w "%{http_code}" "https://crates.io/api/v1/crates/agentkernel/${VERSION}")
          if [ "$HTTP_STATUS" = "200" ]; then
            echo "Version ${VERSION} already published to crates.io, skipping"
          else
            cargo publish
          fi

  helm:
    name: Publish Helm Chart
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}

      - name: Package chart
        run: helm package deploy/helm/agentkernel/

      - name: Push to GHCR
        run: helm push agentkernel-*.tgz oci://ghcr.io/thrashr888/charts

  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Compute SHA256 sums
        id: sha
        run: |
          echo "darwin_arm64=$(sha256sum artifacts/agentkernel-darwin-arm64/agentkernel-darwin-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "darwin_amd64=$(sha256sum artifacts/agentkernel-darwin-x64/agentkernel-darwin-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_arm64=$(sha256sum artifacts/agentkernel-linux-arm64/agentkernel-linux-arm64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "linux_amd64=$(sha256sum artifacts/agentkernel-linux-x64/agentkernel-linux-x64.tar.gz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Update Homebrew formula
        uses: thrashr888/homebrew-tap@main
        with:
          formula: agentkernel
          tag: ${{ github.ref_name }}
          tap-token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          darwin-arm64-sha256: ${{ steps.sha.outputs.darwin_arm64 }}
          darwin-amd64-sha256: ${{ steps.sha.outputs.darwin_amd64 }}
          linux-arm64-sha256: ${{ steps.sha.outputs.linux_arm64 }}
          linux-amd64-sha256: ${{ steps.sha.outputs.linux_amd64 }}
          template: |
            class Agentkernel < Formula
              desc "Run AI coding agents in secure, isolated microVMs"
              homepage "https://thrashr888.github.io/agentkernel/"
              version "${VERSION}"
              license "MIT"

              on_macos do
                on_arm do
                  url "https://github.com/thrashr888/agentkernel/releases/download/${TAG}/agentkernel-darwin-arm64.tar.gz"
                  sha256 "${SHA_DARWIN_ARM64}"
                end
                on_intel do
                  url "https://github.com/thrashr888/agentkernel/releases/download/${TAG}/agentkernel-darwin-x64.tar.gz"
                  sha256 "${SHA_DARWIN_AMD64}"
                end
              end

              on_linux do
                on_arm do
                  url "https://github.com/thrashr888/agentkernel/releases/download/${TAG}/agentkernel-linux-arm64.tar.gz"
                  sha256 "${SHA_LINUX_ARM64}"
                end
                on_intel do
                  url "https://github.com/thrashr888/agentkernel/releases/download/${TAG}/agentkernel-linux-x64.tar.gz"
                  sha256 "${SHA_LINUX_AMD64}"
                end
              end

              def install
                bin.install "agentkernel"
              end

              service do
                run [opt_bin/"agentkernel", "serve", "--host", "127.0.0.1", "--port", "18888"]
                environment_variables PATH: "#{HOMEBREW_PREFIX}/bin:#{HOMEBREW_PREFIX}/sbin:/usr/local/bin:/usr/local/sbin:/Applications/Docker.app/Contents/Resources/bin:/usr/bin:/bin:/usr/sbin:/sbin"
                keep_alive true
                log_path var/"log/agentkernel.log"
                error_log_path var/"log/agentkernel.error.log"
                working_dir HOMEBREW_PREFIX
              end

              test do
                assert_match "agentkernel", shell_output("#{bin}/agentkernel --version")
              end
            end

  homebrew-cask:
    name: Update Homebrew Cask
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Compute DMG SHA256s
        id: sha
        run: |
          echo "arm64=$(sha256sum artifacts/desktop-dmg-arm64/*.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "x64=$(sha256sum artifacts/desktop-dmg-x64/*.dmg | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Push cask to homebrew-tap
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ github.ref_name }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
          SHA_X64: ${{ steps.sha.outputs.x64 }}
        run: |
          VERSION="${TAG#v}"
          cat > agentkernel-cask.rb << CASKEOF
          cask "agentkernel" do
            version "${VERSION}"

            on_arm do
              sha256 "${SHA_ARM64}"
              url "https://github.com/thrashr888/agentkernel/releases/download/v#{version}/AgentKernel_#{version}_aarch64-arm64.dmg"
            end
            on_intel do
              sha256 "${SHA_X64}"
              url "https://github.com/thrashr888/agentkernel/releases/download/v#{version}/AgentKernel_#{version}_x64-x64.dmg"
            end

            name "AgentKernel"
            desc "Desktop app for managing AI coding agent sandboxes"
            homepage "https://thrashr888.github.io/agentkernel/"

            depends_on macos: :ventura

            app "AgentKernel.app"

            zap trash: [
              "~/Library/Application Support/com.agentkernel.desktop",
              "~/Library/Caches/com.agentkernel.desktop",
            ]
          end
          CASKEOF

          git clone "https://x-access-token:${GH_TOKEN}@github.com/thrashr888/homebrew-tap.git" /tmp/homebrew-tap
          mkdir -p /tmp/homebrew-tap/Casks
          cp agentkernel-cask.rb /tmp/homebrew-tap/Casks/agentkernel.rb
          cd /tmp/homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/agentkernel.rb
          git diff --cached --quiet && echo "No changes" && exit 0
          git commit -m "Update agentkernel cask to ${TAG}"
          git push
