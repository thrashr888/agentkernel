    parameters:
      - name: name
        in: path
        required: true
        description: Name of the snapshot
        schema:
          type: string

    get:
      tags: [Snapshots]
      summary: Get snapshot info
      description: Returns information about a specific snapshot.
      operationId: getSnapshot
      responses:
        '200':
          description: Snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Snapshots]
      summary: Delete a snapshot
      description: Removes the snapshot and its Docker image.
      operationId: deleteSnapshot
      responses:
        '200':
          description: Snapshot deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots/{name}/restore:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the snapshot to restore
        schema:
          type: string

    post:
      tags: [Snapshots]
      summary: Restore from snapshot
      description: |
        Creates a new sandbox from a snapshot.
        Defaults to naming the restored sandbox "{original}-restored".
        Snapshots are tenant-scoped; only the owning principal or an explicit
        JWT `admin` may restore them. Restore consumes total quota capacity
        and returns `429` when the authenticated tenant is at its limit.
      operationId: restoreSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreSnapshotRequest'
            examples:
              default:
                summary: Restore with default name
                value: {}
              custom:
                summary: Restore with custom name
                value:
                  as_name: "my-restored-sandbox"
      responses:
        '200':
          description: Sandbox restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreSnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

