openapi: 3.1.0
info:
  title: agentkernel API
  description: |
    HTTP REST API for managing isolated sandboxes. All commands run in secure,
    isolated containers (Docker/Podman) or microVMs (Firecracker).

    ## Security Model

    - All code execution happens in isolated sandboxes
    - Sandboxes cannot access the host filesystem by default
    - Network access can be restricted per security profile
    - Three security profiles: permissive, moderate (default), restrictive

    ## Authentication

    Authentication is optional. When enabled, use Bearer token in the
    Authorization header.
  version: 0.4.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: agentkernel
    url: https://github.com/thrashr888/agentkernel

servers:
  - url: http://localhost:18888
    description: Local development server

tags:
  - name: Health
    description: Health check endpoint
  - name: Run
    description: One-shot command execution
  - name: Sandboxes
    description: Persistent sandbox management
  - name: Files
    description: File operations inside sandboxes
  - name: Batch
    description: Parallel batch execution
  - name: Snapshots
    description: Snapshot and restore operations

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns 200 if the server is healthy.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /run:
    post:
      tags: [Run]
      summary: Run a command in a temporary sandbox
      description: |
        Executes a command in an isolated sandbox and returns the output.
        The sandbox is automatically cleaned up after execution.

        By default, uses a pre-warmed container pool for fast execution (~50ms).
        Set `fast: false` for custom images or advanced options (~500ms).
      operationId: runCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              simple:
                summary: Simple echo command
                value:
                  command: ["echo", "hello world"]
              python:
                summary: Run Python code
                value:
                  command: ["python3", "-c", "print('Hello from Python!')"]
              custom_image:
                summary: Custom image (slow path)
                value:
                  command: ["node", "--version"]
                  image: "node:22-alpine"
                  fast: false
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes:
    get:
      tags: [Sandboxes]
      summary: List all sandboxes
      description: Returns a list of all sandboxes and their current status.
      operationId: listSandboxes
      responses:
        '200':
          description: List of sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Sandboxes]
      summary: Create a new sandbox
      description: |
        Creates a new persistent sandbox. The sandbox starts automatically
        after creation. Use this for workflows that require multiple commands.
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
            examples:
              default:
                summary: Default Alpine sandbox
                value:
                  name: "my-sandbox"
              python:
                summary: Python sandbox
                value:
                  name: "python-sandbox"
                  image: "python:3.12-alpine"
      responses:
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    get:
      tags: [Sandboxes]
      summary: Get sandbox details
      description: Returns details about a specific sandbox.
      operationId: getSandbox
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/by-uuid/{uuid}:
    parameters:
      - $ref: '#/components/parameters/SandboxUUID'

    get:
      tags: [Sandboxes]
      summary: Get sandbox details by UUID
      description: Returns details about a specific sandbox by UUIDv7.
      operationId: getSandboxByUuid
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Sandboxes]
      summary: Delete a sandbox
      description: Stops and removes a sandbox.
      operationId: deleteSandbox
      responses:
        '200':
          description: Sandbox deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/exec:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    post:
      tags: [Sandboxes]
      summary: Execute command in sandbox
      description: Executes a command in an existing running sandbox.
      operationId: execInSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
            examples:
              simple:
                summary: List files
                value:
                  command: ["ls", "-la"]
              python:
                summary: Run Python
                value:
                  command: ["python3", "-c", "import sys; print(sys.version)"]
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
      - name: path
        in: path
        required: true
        description: File path inside the sandbox (relative, e.g. tmp/hello.txt)
        schema:
          type: string

    get:
      tags: [Files]
      summary: Read a file from a sandbox
      operationId: readFile
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Files]
      summary: Write a file to a sandbox
      operationId: writeFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
            examples:
              text:
                summary: Write text file
                value:
                  content: "hello world"
              base64:
                summary: Write binary file
                value:
                  content: "aGVsbG8="
                  encoding: "base64"
      responses:
        '200':
          description: File written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Files]
      summary: Delete a file from a sandbox
      operationId: deleteFile
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/logs:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    get:
      tags: [Sandboxes]
      summary: Get sandbox audit logs
      description: Returns audit log entries for this sandbox.
      operationId: getSandboxLogs
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLogsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/extend:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    post:
      tags: [Sandboxes]
      summary: Extend sandbox TTL
      description: |
        Extends the sandbox's time-to-live by the specified duration.
        If the sandbox has no current TTL, sets expiry from now.
      operationId: extendSandboxTtl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendTtlRequest'
            examples:
              default:
                summary: Extend by 1 hour (default)
                value: {}
              custom:
                summary: Extend by 30 minutes
                value:
                  by: "30m"
      responses:
        '200':
          description: TTL extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendTtlResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots:
    get:
      tags: [Snapshots]
      summary: List all snapshots
      description: Returns a list of all saved snapshots.
      operationId: listSnapshots
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Snapshots]
      summary: Take a snapshot
      description: |
        Creates a snapshot of a sandbox's current state.
        Uses Docker commit internally.
      operationId: takeSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeSnapshotRequest'
            examples:
              simple:
                summary: Snapshot a sandbox
                value:
                  sandbox: "my-sandbox"
                  name: "checkpoint-1"
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the snapshot
        schema:
          type: string

    get:
      tags: [Snapshots]
      summary: Get snapshot info
      description: Returns information about a specific snapshot.
      operationId: getSnapshot
      responses:
        '200':
          description: Snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Snapshots]
      summary: Delete a snapshot
      description: Removes the snapshot and its Docker image.
      operationId: deleteSnapshot
      responses:
        '200':
          description: Snapshot deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots/{name}/restore:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the snapshot to restore
        schema:
          type: string

    post:
      tags: [Snapshots]
      summary: Restore from snapshot
      description: |
        Creates a new sandbox from a snapshot.
        Defaults to naming the restored sandbox "{original}-restored".
      operationId: restoreSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreSnapshotRequest'
            examples:
              default:
                summary: Restore with default name
                value: {}
              custom:
                summary: Restore with custom name
                value:
                  as_name: "my-restored-sandbox"
      responses:
        '200':
          description: Sandbox restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreSnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /batch/run:
    post:
      tags: [Batch]
      summary: Run multiple commands in parallel
      description: |
        Executes multiple commands in parallel, each in its own temporary sandbox.
        Results are returned in the same order as the input commands.
      operationId: batchRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRunRequest'
            examples:
              simple:
                summary: Two echo commands
                value:
                  commands:
                    - command: ["echo", "hello"]
                    - command: ["echo", "world"]
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

components:
  schemas:
    RunRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
          example: ["echo", "hello"]
        image:
          type: string
          description: |
            Docker image to use (only when fast=false).
            If not specified, auto-detected from command.
          example: "python:3.12-alpine"
        profile:
          type: string
          enum: [permissive, moderate, restrictive]
          default: moderate
          description: |
            Security profile (only when fast=false).
            - permissive: network, mounts, env passthrough
            - moderate: network enabled, no mounts
            - restrictive: no network, read-only filesystem
        fast:
          type: boolean
          default: true
          description: |
            Use container pool for fast execution (~50ms).
            Set to false for custom images or profiles (~500ms).

    CreateSandboxRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
          maxLength: 64
          description: Unique name for the sandbox
          example: "my-sandbox"
        image:
          type: string
          default: "alpine:3.20"
          description: Docker image to use
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          default: 1
          description: Number of virtual CPUs
        memory_mb:
          type: integer
          default: 512
          description: Memory in megabytes
        profile:
          type: string
          enum: [permissive, moderate, restrictive]
          description: Security profile

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
          example: ["ls", "-la"]

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: "ok"

    RunResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            output:
              type: string
              description: Combined stdout/stderr from command
              example: "hello world\n"

    SandboxInfo:
      type: object
      required: [name, uuid, status, backend]
      properties:
        name:
          type: string
          example: "my-sandbox"
        uuid:
          type: string
          format: uuid
          description: Globally unique sandbox identifier (UUIDv7)
          example: "019abc12-1234-7def-89ab-0123456789ab"
        status:
          type: string
          enum: [running, stopped]
          example: "running"
        backend:
          type: string
          example: "docker"
        image:
          type: string
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          example: 1
        memory_mb:
          type: integer
          example: 512
        created_at:
          type: string
          example: "2026-01-30T12:00:00Z"

    SandboxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SandboxInfo'

    SandboxListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SandboxInfo'

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: "Sandbox removed"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Sandbox not found"

    FileWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: File content (text or base64-encoded)
        encoding:
          type: string
          enum: [utf8, base64]
          default: utf8
          description: Content encoding

    FileReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            content:
              type: string
              description: File content
            encoding:
              type: string
              enum: [utf8, base64]
            size:
              type: integer
              description: File size in bytes

    BatchRunRequest:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            type: object
            required: [command]
            properties:
              command:
                type: array
                items:
                  type: string
                description: Command and arguments

    BatchRunResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  output:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true

    SandboxLogsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            description: Audit log entry

    ExtendTtlRequest:
      type: object
      properties:
        by:
          type: string
          default: "1h"
          description: Duration to extend by (e.g., "1h", "30m", "2d")
          example: "1h"

    ExtendTtlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            expires_at:
              type: string
              nullable: true
              description: New expiry time in RFC3339 format
              example: "2026-02-05T15:00:00Z"

    SnapshotInfo:
      type: object
      properties:
        name:
          type: string
          example: "checkpoint-1"
        sandbox:
          type: string
          description: Original sandbox name
          example: "my-sandbox"
        image_tag:
          type: string
          description: Docker image tag for the snapshot
          example: "agentkernel-snap:checkpoint-1"
        backend:
          type: string
          example: "docker"
        base_image:
          type: string
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          example: 2
        memory_mb:
          type: integer
          example: 512
        created_at:
          type: string
          example: "2026-02-05T12:00:00Z"

    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SnapshotInfo'

    SnapshotListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotInfo'

    TakeSnapshotRequest:
      type: object
      required: [sandbox, name]
      properties:
        sandbox:
          type: string
          description: Name of the sandbox to snapshot
          example: "my-sandbox"
        name:
          type: string
          description: Name for the snapshot
          example: "checkpoint-1"

    RestoreSnapshotRequest:
      type: object
      properties:
        as_name:
          type: string
          description: Name for the restored sandbox (defaults to original + "-restored")
          example: "my-restored-sandbox"

    RestoreSnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sandbox:
              type: string
              description: Name of the restored sandbox
              example: "my-sandbox-restored"
            from_snapshot:
              type: string
              description: Snapshot that was restored
              example: "checkpoint-1"

  parameters:
    SandboxName:
      name: name
      in: path
      required: true
      description: Name of the sandbox
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
    SandboxUUID:
      name: uuid
      in: path
      required: true
      description: Sandbox UUID (UUIDv7)
      schema:
        type: string
        format: uuid

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "command is required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Sandbox not found"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Failed to start container"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional API key authentication. When enabled, include the
        API key in the Authorization header as a Bearer token.

# Security is optional - uncomment to require authentication
# security:
#   - BearerAuth: []
