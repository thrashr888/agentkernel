          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'

  /scim/v2/ResourceTypes/{id}:
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Get a SCIM resource type
      operationId: getScimResourceType
      parameters:
        - $ref: '#/components/parameters/ScimResourceId'
      responses:
        '200':
          description: SCIM resource type
          content:
            application/scim+json:
              schema:
                type: object

  /scim/v2/Schemas:
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: List SCIM schemas
      operationId: listScimSchemas
      responses:
        '200':
          description: SCIM schemas
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'

  /scim/v2/Schemas/{id}:
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Get a SCIM schema
      operationId: getScimSchema
      parameters:
        - $ref: '#/components/parameters/ScimResourceId'
      responses:
        '200':
          description: SCIM schema
          content:
            application/scim+json:
              schema:
                type: object

  /scim/v2/Users:
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: List provisioned users
      operationId: listScimUsers
      parameters:
        - $ref: '#/components/parameters/ScimFilter'
        - $ref: '#/components/parameters/ScimStartIndex'
        - $ref: '#/components/parameters/ScimCount'
      responses:
        '200':
          description: SCIM user list
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'
    post:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Provision a user
      operationId: createScimUser
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUserInput'
      responses:
        '201':
          description: User created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'

  /scim/v2/Users/{id}:
    parameters:
      - $ref: '#/components/parameters/ScimResourceId'
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Get a provisioned user
      operationId: getScimUser
      responses:
        '200':
          description: SCIM user
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
    put:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Replace a provisioned user
      operationId: replaceScimUser
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimUserInput'
      responses:
        '200':
          description: User replaced
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
    patch:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Patch or deactivate a user
      operationId: patchScimUser
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatch'
      responses:
        '200':
          description: User patched
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimUser'
    delete:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Delete a provisioned user
      description: Tombstones the resource. Use PATCH active false for non-deleting deactivation.
      operationId: deleteScimUser
      responses:
        '204':
          description: User deleted

  /scim/v2/Groups:
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: List provisioned groups
      operationId: listScimGroups
      parameters:
        - $ref: '#/components/parameters/ScimFilter'
        - $ref: '#/components/parameters/ScimStartIndex'
        - $ref: '#/components/parameters/ScimCount'
      responses:
        '200':
          description: SCIM group list
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimListResponse'
    post:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Provision a group
      operationId: createScimGroup
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroupInput'
      responses:
        '201':
          description: Group created
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'

  /scim/v2/Groups/{id}:
    parameters:
      - $ref: '#/components/parameters/ScimResourceId'
    get:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Get a provisioned group
      operationId: getScimGroup
      responses:
        '200':
          description: SCIM group
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
    put:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Replace a group and synchronize membership
      operationId: replaceScimGroup
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimGroupInput'
      responses:
        '200':
          description: Group replaced
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
    patch:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Patch group membership
      operationId: patchScimGroup
      requestBody:
        required: true
        content:
          application/scim+json:
            schema:
              $ref: '#/components/schemas/ScimPatch'
      responses:
        '200':
          description: Group patched
          content:
            application/scim+json:
              schema:
                $ref: '#/components/schemas/ScimGroup'
    delete:
      tags: [SCIM]
      security: [{BearerAuth: []}]
      summary: Delete a provisioned group
      description: Tombstones the group while preserving internal membership history.
      operationId: deleteScimGroup
      responses:
        '204':
          description: Group deleted

components:
  parameters:
    ScimResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        pattern: '^[A-Za-z0-9._:-]{1,128}$'
    ScimFilter:
      name: filter
      in: query
      schema:
        type: string
      description: Equality filter such as userName eq "alice@example.com".
    ScimStartIndex:
      name: startIndex
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    ScimCount:
      name: count
      in: query
      schema:
        type: integer
        minimum: 0
        maximum: 100
        default: 100
  schemas:
    ScimUserInput:
      type: object
      required: [schemas, userName]
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [urn:ietf:params:scim:schemas:core:2.0:User]
        userName:
          type: string
        externalId:
          type: string
        active:
          type: boolean
          default: true
        displayName:
          type: string
        name:
          type: object
          properties:
            givenName: {type: string}
            familyName: {type: string}
        emails:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: {type: string, format: email}
              type: {type: string}
              primary: {type: boolean}
        locale: {type: string}
        timezone: {type: string}
    ScimUser:
      allOf:
        - $ref: '#/components/schemas/ScimUserInput'
        - type: object
          required: [schemas, id, meta]
          properties:
            schemas:
              type: array
              items: {type: string}
            id: {type: string}
            meta: {type: object}
    ScimGroupInput:
      type: object
      required: [schemas, displayName]
      properties:
        schemas:
          type: array
          minItems: 1
          maxItems: 1
          items:
            type: string
            enum: [urn:ietf:params:scim:schemas:core:2.0:Group]
        displayName: {type: string}
        externalId: {type: string}
        members:
          type: array
          items:
            type: object
            required: [value]
            properties:
              value: {type: string}
              display: {type: string}
    ScimGroup:
      allOf:
        - $ref: '#/components/schemas/ScimGroupInput'
        - type: object
          required: [schemas, id, meta]
          properties:
            schemas:
              type: array
              items: {type: string}
            id: {type: string}
            meta: {type: object}
    ScimPatch:
      type: object
      required: [schemas, Operations]
      properties:
        schemas:
          type: array
          items: {type: string}
          minItems: 1
        Operations:
          type: array
          minItems: 1
          maxItems: 32
          items:
            type: object
            required: [op]
            properties:
              op: {type: string, enum: [add, replace, remove]}
              path: {type: string}
              value: {}
    ScimListResponse:
      type: object
      required: [schemas, totalResults, startIndex, itemsPerPage, Resources]
      properties:
        schemas:
          type: array
          items: {type: string}
        totalResults: {type: integer}
        startIndex: {type: integer}
        itemsPerPage: {type: integer}
        Resources:
          type: array
          items: {type: object}
    QuotaLimits:
      type: object
      properties:
        max_running_sandboxes:
          type: integer
          minimum: 0
          description: Maximum concurrently running sandboxes; zero denies starts.
        max_total_sandboxes:
          type: integer
          minimum: 0
          description: Maximum persisted sandboxes, including stopped sandboxes.
        max_total_vcpus:
          type: integer
          minimum: 0
        max_total_memory_mb:
          type: integer
          minimum: 0
      additionalProperties: false

    QuotaUsage:
      type: object
      required: [total_sandboxes, running_sandboxes, total_vcpus, total_memory_mb]
      properties:
        total_sandboxes:
          type: integer
        running_sandboxes:
          type: integer
        total_vcpus:
          type: integer
        total_memory_mb:
          type: integer

    QuotaScopeStatus:
      type: object
      required: [id, limits, usage]
      properties:
        id:
          type: string
        limits:
          $ref: '#/components/schemas/QuotaLimits'
        usage:
          $ref: '#/components/schemas/QuotaUsage'

    QuotaStatus:
      type: object
      required: [enabled, user, organization]
      properties:
        enabled:
          type: boolean
        user:
          $ref: '#/components/schemas/QuotaScopeStatus'
        organization:
          $ref: '#/components/schemas/QuotaScopeStatus'

    QuotaStatusResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
        data:
          $ref: '#/components/schemas/QuotaStatus'
        error:
          type: string
    RunRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
          example: ["echo", "hello"]
        image:
          type: string
          description: |
            Docker image to use (only when fast=false).
            If not specified, auto-detected from command.
          example: "python:3.12-alpine"
        profile:
          type: string
          enum: [permissive, moderate, restrictive]
          default: moderate
          description: |
            Security profile (only when fast=false).
            - permissive: network, mounts, env passthrough
            - moderate: network enabled, no mounts
            - restrictive: no network, read-only filesystem
        fast:
          type: boolean
          default: true
          description: |
            Use container pool for fast execution (~50ms).
            Set to false for custom images or profiles (~500ms).

    CreateTaskRequest:
      type: object
      additionalProperties: false
      required: [prompt, sandbox]
      properties:
        prompt:
          type: string
          minLength: 1
          maxLength: 1048576
          description: Prompt to dispatch to the agent worker
        sandbox:
          type: string
          pattern: '^[A-Za-z0-9](?:[A-Za-z0-9_-]*[A-Za-z0-9])?$'
          maxLength: 63
          description: Target sandbox name (also accepted as target_sandbox)

    Task:
      type: object
      required: [id, prompt, sandbox, status, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
          description: UUIDv7 task identifier
        prompt:
          type: string
        sandbox:
          type: string
        status:
          type: string
          enum: [queued, running, completed, failed, cancelled]
        isolation:
          nullable: true
          description: Per-task sandbox and Git worktree allocated by the worker
          allOf:
            - $ref: '#/components/schemas/TaskIsolation'
        result:
          type: string
          nullable: true
          description: Agent output or a reviewable Git diff when completed
        error:
          type: string
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    TaskIsolation:
      type: object
      required: [sandbox, branch]
      properties:
        sandbox:
          type: string
          description: Dedicated sandbox used by this task
        branch:
          type: string
          description: Dedicated Git branch created from the base ref
        worktree:
          type: string
          nullable: true
          description: Opaque identifier of the dedicated Git worktree
        base_ref:
          type: string
          nullable: true
          description: Commit from which the task branch was created

    TaskResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Task'

    TaskListResponse:
      type: object
      required: [success, data]
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'

    CreateSandboxRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
          maxLength: 64
          description: Unique name for the sandbox
          example: "my-sandbox"
        backend:
          type: string
          description: Backend identifier. Omit or use `automatic` for server selection.
          example: "docker"
        image:
          type: string
          default: "alpine:3.24"
          description: Docker image to use
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          default: 1
          description: Number of virtual CPUs
        memory_mb:
          type: integer
          default: 512
          description: Memory in megabytes
        profile:
          type: string
          enum: [permissive, moderate, restrictive]
          description: Security profile
        volumes:
          type: array
          items:
            type: string
          description: Persistent volume mounts in `slug:/container/path` or `slug:/container/path:ro` format. Volumes must already exist. Named mounts are supported by Docker and Podman backends.
          example: ["my-data:/data", "cache:/cache:ro"]
        network:
          $ref: '#/components/schemas/ManagedNetworkConfig'
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined labels for fleet management and filtering
          example:
            env: "prod"
            team: "ml"
        description:
          type: string
          description: User-defined description
        lifecycle:
          $ref: '#/components/schemas/LifecyclePolicy'

    ManagedNetworkConfig:
      type: object
      additionalProperties: false
      required: [name]
      description: |
        AgentKernel-managed bridge networking for Docker and Podman. The
        network is persisted with the sandbox and address leases are stored
        durably. Existing networks must carry AgentKernel ownership labels;
        externally owned networks are never adopted or removed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 63
          pattern: '^[A-Za-z0-9][A-Za-z0-9_.-]*$'
          description: Runtime network name.
        subnet:
          type: string
          default: "172.30.0.0/24"
          description: IPv4 network CIDR; the address must be the network address.
          example: "172.30.0.0/24"
        gateway:
          type: string
          format: ipv4
          description: IPv4 gateway inside the subnet. Defaults to the first host address.
          example: "172.30.0.1"
        dns:
          type: array
          items:
            type: string
            format: ipv4
          description: IPv4 DNS servers passed to each managed container at runtime.
          example: ["1.1.1.1", "8.8.8.8"]
        static_ip:
          type: string
          format: ipv4
          description: Optional fixed IPv4 address for this sandbox. It cannot be changed after allocation.
          example: "172.30.0.10"

    StartSandboxRequest:
      type: object
      additionalProperties: false
      properties:
        configuration:
          type: object
          additionalProperties: false
          required: [source, token]
          description: |
            Select the server-derived private start configuration previously
            persisted by the local CLI. Callers cannot provide permission or
            file-injection values in the HTTP request. The token is one-shot
            and bound to the sandbox UUID, owner, request identity, and a
            five-minute validity window.
          properties:
            source:
              type: string
              enum: [persisted]
            token:
              type: string
              pattern: '^[0-9a-f]{64}$'
              description: Opaque one-shot nonce generated by the local CLI.

    ResizeSandboxRequest:
      type: object
      properties:
        vcpus:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 1
      minProperties: 1

    PatchSandboxRequest:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: Replace all labels
        description:
          type: string
          description: Update description
        lifecycle:
          description: Set lifecycle policy, or `null` to clear policy
          oneOf:
            - $ref: '#/components/schemas/LifecyclePolicy'
            - type: "null"

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
          example: ["ls", "-la"]

    GitRepoRequest:
      type: object
      required: [path]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Git repository path inside the sandbox
        remote:
          type: string
          description: Optional validated Git remote name
        branch:
          type: string
          description: Optional validated branch/ref name
        set_upstream:
          type: boolean
          default: false
        username:
          type: string
          description: Reserved for SDK compatibility; configure credentials in the sandbox
        password:
          type: string
          format: password
          description: Reserved for SDK compatibility; configure credentials in the sandbox

    GitAddRequest:
      type: object
      required: [path, files]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Git repository path inside the sandbox
        files:
          type: array
          minItems: 1
          items:
            type: string
          description: Relative files to stage; use `.` for the whole repository

    GitCommitRequest:
      type: object
      required: [path, message]
      additionalProperties: false
      properties:
        path:
          type: string
          description: Git repository path inside the sandbox
        message:
          type: string
          minLength: 1
        author:
          type: string
          description: Optional commit author name; must be paired with email
        email:
          type: string
          description: Optional commit author email; must be paired with author
        allow_empty:
          type: boolean
          default: false

    GitFileStatus:
      type: object
      required: [name, extra, staging, worktree]
      properties:
        name:
          type: string
        extra:
          type: string
        staging:
          type: string
        worktree:
          type: string

    GitStatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [currentBranch, fileStatus, branchPublished, ahead, behind, detached]
          properties:
            currentBranch:
              type: string
            fileStatus:
              type: array
              items:
                $ref: '#/components/schemas/GitFileStatus'
            branchPublished:
              type: boolean
            ahead:
              type: integer
              minimum: 0
            behind:
              type: integer
              minimum: 0
            upstream:
              type: string
            detached:
              type: boolean

    GitBranchesResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [branches, current]
          properties:
            branches:
              type: array
              items:
                type: string
            current:
              type: string

    GitCommitResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [hash]
          properties:
            hash:
              type: string

    GitOperationResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required: [output]
          properties:
            output:
              type: string

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: "ok"

    RunResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            output:
              type: string
              description: Combined stdout/stderr from command
              example: "hello world\n"

    StatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            version:
              type: string
              example: "0.15.0"
            backend:
              type: string
              example: "docker"
            api_key_configured:
              type: boolean
              example: false

    BackendDiscoveryResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/BackendDiscovery'

    BackendDiscovery:
      type: object
      required: [backends]
      properties:
        default_backend:
          type: string
          nullable: true
          description: Backend used when creation requests Automatic selection
        backends:
          type: array
          items:
            $ref: '#/components/schemas/BackendDescriptor'

    BackendDescriptor:
      type: object
      required: [backend, configured, usable, readiness_reason, capabilities]
      properties:
        backend:
          type: string
        configured:
          type: boolean
        usable:
          type: boolean
        readiness_reason:
          type: string
        capabilities:
          $ref: '#/components/schemas/BackendCapabilities'

    BackendCapabilities:
      type: object
      required: [mount_cwd, mount_home, attach, host_volumes, ssh, proxy_secret_bindings, secret_files, snapshots, resume, full_state_pause_resume, full_state_fork, endpoints]
      properties:
        mount_cwd: {type: boolean}
        mount_home: {type: boolean}
        attach: {type: boolean}
        host_volumes: {type: boolean}
        ssh: {type: boolean}
        proxy_secret_bindings: {type: boolean}
        secret_files: {type: boolean}
        snapshots: {type: boolean}
        resume: {type: boolean}
        full_state_pause_resume:
          type: boolean
          description: Preserves guest memory, process, and device state; currently Firecracker only
        full_state_fork:
          type: boolean
          description: Restores independent running children from a paused full-state checkpoint; currently Firecracker only
        endpoints: {type: boolean}

    StatsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sandbox_count:
              type: integer
              example: 12
            sandbox_limit:
              type: integer
              example: 0
              description: 0 means unlimited
            backend:
              type: string
              example: "docker"
            uptime_seconds:
              type: integer
              example: 3600
            version:
              type: string
              example: "0.15.0"
            resource_usage:
              type: object
              properties:
                cpu_percent:
                  type: number
                  format: float
                  example: 65.2
                memory_used_mb:
                  type: integer
                  example: 8192
                memory_total_mb:
                  type: integer
                  example: 16384
                disk_used_mb:
                  type: integer
                  example: 4096

    GcResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            removed:
              type: array
              items:
                type: string
              description: Names of removed sandboxes
              example: ["old-sandbox-1", "expired-test"]

    LifecyclePolicy:
      type: object
      properties:
        auto_stop_after_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Stop sandbox after this many seconds of inactivity
        auto_archive_after_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Archive sandbox after this many seconds of inactivity
        auto_delete_after_seconds:
          type: integer
          format: int64
          minimum: 0
          description: Delete archived sandbox after this many seconds

    ReconcileLifecycleRequest:
      type: object
      properties:
        dry_run:
          type: boolean
          default: false
          description: Preview lifecycle actions without mutating sandboxes

    LifecycleAction:
      type: object
      required: [sandbox, action, reason]
      properties:
        sandbox:
          type: string
          description: Sandbox name
        action:
          type: string
          enum: [stop, archive, delete]
        reason:
          type: string

    LifecycleReconcileResult:
      type: object
      required: [dry_run, stopped, archived, removed, actions]
      properties:
        dry_run:
          type: boolean
        stopped:
          type: array
          items:
            type: string
        archived:
          type: array
          items:
            type: string
        removed:
          type: array
          items:
            type: string
        actions:
          type: array
          items:
            $ref: '#/components/schemas/LifecycleAction'

    LifecycleReconcileResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/LifecycleReconcileResult'

    SandboxInfo:
      type: object
      required: [name, uuid, status, backend]
      properties:
        name:
          type: string
          example: "my-sandbox"
        uuid:
          type: string
          format: uuid
          description: Globally unique sandbox identifier (UUIDv7)
          example: "019abc12-1234-7def-89ab-0123456789ab"
        status:
          type: string
          enum: [running, paused, stopped, dormant, archived]
          example: "running"
        backend:
          type: string
          example: "docker"
        image:
          type: string
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          example: 1
        memory_mb:
          type: integer
          example: 512
        created_at:
          type: string
          example: "2026-01-30T12:00:00Z"
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined labels
        description:
          type: string
          description: User-defined description
        last_activity_at:
          type: string
          description: Last observed sandbox activity timestamp (RFC3339)
          example: "2026-02-23T15:04:05Z"
        archived_at:
          type: string
          description: Archive timestamp (RFC3339), when sandbox is archived
          example: "2026-02-23T16:04:05Z"
        archived_reason:
          type: string
          description: Human-readable archive reason
        lifecycle:
          $ref: '#/components/schemas/LifecyclePolicy'

    SandboxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SandboxInfo'

    ForkSandboxRequest:
      type: object
      additionalProperties: false
      required: [as_name]
      properties:
        as_name:
          type: string
          description: Name for the new running sandbox
          example: "experiment-b"

    ForkSandboxResult:
      type: object
      required: [sandbox, security_warning]
      properties:
        sandbox:
          $ref: '#/components/schemas/SandboxInfo'
        security_warning:
          type: string
          description: Warning that guest memory and filesystem state, including captured credentials, were cloned.
          example: "Forking duplicates userspace memory. Rotate cached identifiers and cryptographic tokens in each child; prefer proxy-managed secrets that never enter the VM."

    ForkSandboxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ForkSandboxResult'

    SandboxListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SandboxInfo'

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: "Sandbox removed"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Sandbox not found"

    FileWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: File content (text or base64-encoded)
        encoding:
          type: string
          enum: [utf8, base64]
          default: utf8
          description: Content encoding

    FileReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            content:
              type: string
              description: File content
            encoding:
              type: string
              enum: [utf8, base64]
            size:
              type: integer
              description: File size in bytes

    BatchRunRequest:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            type: object
            required: [command]
            properties:
              command:
                type: array
                items:
                  type: string
                description: Command and arguments

    BatchRunResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  output:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true

    SandboxLogsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            description: Audit log entry

    ExtendTtlRequest:
      type: object
      properties:
        by:
          type: string
          default: "1h"
          description: Duration to extend by (e.g., "1h", "30m", "2d")
          example: "1h"

    ExtendTtlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            expires_at:
              type: string
              nullable: true
              description: New expiry time in RFC3339 format
              example: "2026-02-05T15:00:00Z"

    SnapshotInfo:
      type: object
      properties:
        name:
          type: string
          example: "checkpoint-1"
        sandbox:
          type: string
          description: Original sandbox name
          example: "my-sandbox"
        image_tag:
          type: string
          description: Docker image tag for the snapshot
          example: "agentkernel-snap:checkpoint-1"
        backend:
          type: string
          example: "docker"
        base_image:
          type: string
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          example: 2
        memory_mb:
          type: integer
          example: 512
        created_at:
          type: string
          example: "2026-02-05T12:00:00Z"

    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SnapshotInfo'

    SnapshotListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotInfo'

    TakeSnapshotRequest:
      type: object
      required: [sandbox, name]
      properties:
        sandbox:
          type: string
          description: Name of the sandbox to snapshot
          example: "my-sandbox"
        name:
          type: string
          description: Name for the snapshot
          example: "checkpoint-1"

    RestoreSnapshotRequest:
      type: object
      properties:
        as_name:
          type: string
          description: Name for the restored sandbox (defaults to original + "-restored")
          example: "my-restored-sandbox"

    RestoreSnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sandbox:
              type: string
              description: Name of the restored sandbox
              example: "my-sandbox-restored"
            from_snapshot:
              type: string
              description: Snapshot that was restored
              example: "checkpoint-1"

  parameters:
    SandboxName:
      name: name
      in: path
      required: true
      description: Name of the sandbox
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
    SandboxUUID:
      name: uuid
      in: path
      required: true
      description: Sandbox UUID (UUIDv7)
      schema:
        type: string
        format: uuid

    DurableObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class:
          type: string
        object_id:
          type: string
        status:
          type: string
          enum: [active, hibernating, deleted]
        sandbox:
          type: string
          nullable: true
        storage:
          type: object
        idle_timeout_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDurableObject:
      type: object
      required: [class, object_id]
      properties:
        class:
          type: string
        object_id:
          type: string
        sandbox:
          type: string
        storage:
          type: object
        idle_timeout_seconds:
          type: integer
          default: 300

    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cron:
          type: string
          nullable: true
        fire_at:
          type: string
          format: date-time
          nullable: true
        method:
          type: string
        args:
          type: object
        target_class:
          type: string
          nullable: true
        target_object_id:
          type: string
          nullable: true
        target_orchestration:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, paused, completed]
        last_fired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    ConfiguredScheduleStatus:
      type: object
      required: [id, enabled, cron, target, status]
      properties:
        id:
          type: string
        enabled:
          type: boolean
        cron:
          type: string
          description: Five-field cron expression evaluated in UTC
        target:
          type: string
          enum: [sandbox_command, orchestration, object_method]
        status:
          type: string
          enum: [idle, running, success, failed, disabled]
        last_run_at:
          type: string
          format: date-time
          nullable: true
        last_error:
          type: string
          nullable: true
        next_run_at:
          type: string
          format: date-time
          nullable: true

    ConfiguredScheduleExecution:
      type: object
      required: [id, status]
      properties:
        id:
          type: string
        status:
          type: string
          enum: [success, failed]
        output:
          type: string
          nullable: true
        error:
          type: string
          nullable: true

    PatchDurableObject:
      type: object
      properties:
        storage:
          type: object
          description: Replace the object's storage (arbitrary JSON)
        status:
          type: string
          enum: [active, hibernating]
          description: Set the object status

    DurableStore:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [sqlite, kv, queue]
        sandbox:
          type: string
          nullable: true
        config:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDurableStore:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [sqlite, kv, queue]
        sandbox:
          type: string
        config:
          type: object

    StoreQueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
        row_count:
          type: integer

    StoreExecuteResult:
      type: object
      properties:
        rows_affected:
          type: integer

    LlmSpendMetric:
      type: object
      required:
        - bucket
        - tenant
        - agent
        - user
        - project
        - provider
        - model
        - request_count
        - streaming_count
        - input_tokens
        - output_tokens
        - total_tokens
        - last_request
      properties:
        bucket: {type: string, format: date}
        tenant: {type: string}
        agent: {type: string}
        user: {type: string}
        project: {type: string}
        provider: {type: string}
        model: {type: string}
        request_count: {type: integer, format: int64}
        streaming_count: {type: integer, format: int64}
        input_tokens: {type: integer, format: int64}
        output_tokens: {type: integer, format: int64}
        total_tokens: {type: integer, format: int64}
        last_request: {type: string, format: date-time}

    MonetaryCostStatus:
      type: object
      required: [available, reason]
      properties:
        available: {type: boolean}
        currency: {type: string, nullable: true}
        reason: {type: string}

    LlmSpendResponse:
      type: object
      required: [success, data]
      properties:
        success: {type: boolean}
        data:
          type: object
          required: [metrics, retention_days, monetary_cost]
          properties:
            metrics:
              type: array
              items: {$ref: '#/components/schemas/LlmSpendMetric'}
            next_offset: {type: integer, nullable: true}
            retention_days: {type: integer}
            monetary_cost:
              $ref: '#/components/schemas/MonetaryCostStatus'
        error: {type: string, nullable: true}

    CreateSchedule:
      type: object
      required: [name, method]
      properties:
        name:
          type: string
        cron:
          type: string
          description: Cron expression (mutually exclusive with fire_at)
        fire_at:
          type: string
          format: date-time
          description: One-shot fire time (mutually exclusive with cron)
        method:
          type: string
        args:
          type: object
        target_class:
          type: string
        target_object_id:
          type: string
        target_orchestration:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "command is required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Sandbox not found"

    Conflict:
      description: Sandbox is not running or operation conflicts with its state
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Sandbox is not running"

    UnprocessableEntity:
      description: Git command failed inside the sandbox
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "git commit failed"

    QuotaExceeded:
      description: Tenant resource quota denied the lifecycle request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Resource quota denied: organization quota exceeded for max_total_sandboxes: current 12, requested 1, limit 12"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Failed to start container"

    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    Forbidden:
      description: Authenticated identity lacks the required access or policy permission
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

    ServiceUnavailable:
      description: A required service, policy engine, or durable store is unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional API key authentication. When enabled, include the
        API key in the Authorization header as a Bearer token.
