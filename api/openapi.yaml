openapi: 3.1.0
info:
  title: agentkernel API
  description: |
    HTTP REST API for managing isolated sandboxes. All commands run in secure,
    isolated containers (Docker/Podman) or microVMs (Firecracker).

    ## Security Model

    - All code execution happens in isolated sandboxes
    - Sandboxes cannot access the host filesystem by default
    - Network access can be restricted per security profile
    - Three security profiles: permissive, moderate (default), restrictive

    ## Authentication

    Authentication is optional. When enabled, use Bearer token in the
    Authorization header.
  version: 0.15.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: agentkernel
    url: https://github.com/thrashr888/agentkernel

servers:
  - url: http://localhost:18888
    description: Local development server

security:
  - {}
  - BearerAuth: []

tags:
  - name: Health
    description: Health check endpoint
  - name: Run
    description: One-shot command execution
  - name: Tasks
    description: Durable agent task submission and lifecycle management
  - name: Sandboxes
    description: Persistent sandbox management
  - name: Files
    description: File operations inside sandboxes
  - name: Batch
    description: Parallel batch execution
  - name: Snapshots
    description: Snapshot and restore operations
  - name: Objects
    description: Durable object management (stateful sandbox actors)
  - name: Schedules
    description: Schedule management (timed triggers)
  - name: Stores
    description: Durable store management (sqlite, kv, queue)
  - name: Events
    description: Real-time sandbox lifecycle event stream
  - name: LLM Spend
    description: Authenticated, token-only LLM usage aggregates
  - name: SCIM
    description: Authenticated SCIM 2.0 user provisioning and group membership sync
  - name: Quotas
    description: Tenant-scoped enterprise resource quotas

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns 200 if the server is healthy.
      operationId: healthCheck
      security: []
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /metrics:
    get:
      tags: [Health]
      summary: Prometheus metrics
      description: Returns Prometheus metrics in the text exposition format.
      operationId: getMetrics
      security: []
      responses:
        '200':
          description: Prometheus metrics
          content:
            text/plain:
              schema:
                type: string

  /llm/spend:
    get:
      tags: [LLM Spend]
      summary: Query identity-aware LLM token usage
      description: |
        Returns daily aggregates from intercepted LLM traffic. This endpoint
        requires a validated JWT or configured API key even when the rest of
        the server allows anonymous local requests. Non-admin identities are
        hard-filtered to their authenticated organization and user. The
        response contains token counts only; prompts, responses, headers,
        secrets, and monetary estimates are never returned.
      operationId: getLlmSpend
      security:
        - BearerAuth: []
      parameters:
        - name: agent
          in: query
          schema: {type: string}
        - name: user
          in: query
          schema: {type: string}
        - name: project
          in: query
          schema: {type: string}
        - name: from
          in: query
          description: Inclusive UTC date (YYYY-MM-DD) or RFC3339 timestamp
          schema: {type: string}
        - name: to
          in: query
          description: Inclusive UTC date (YYYY-MM-DD) or RFC3339 timestamp
          schema: {type: string}
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 200, default: 100}
        - name: offset
          in: query
          schema: {type: integer, minimum: 0, maximum: 100000, default: 0}
      responses:
        '200':
          description: Daily token aggregates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmSpendResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /quotas:
    get:
      tags: [Quotas]
      summary: Get tenant-scoped resource quota usage
      description: |
        Returns the authenticated user's and organization's configured limits
        and current usage. When enterprise quotas are disabled, `enabled` is
        false and usage is still returned for the authenticated tenant.
        Quota accounting covers persistent HTTP create, list, get, start,
        stop, pause, resume, fork, resize, delete, logs, snapshot restore, and
        config import. Snapshot restore is created stopped and consumes total
        capacity; its running slot is charged when started. Firecracker CLI
        and MCP lifecycle operations delegate through these quota-enforced
        HTTP routes. Ephemeral `/run`, direct CLI/MCP manager calls, scheduler,
        and background object/task entrypoints are not quota-accounted. All
        sandbox-scoped HTTP routes are owner-filtered;
        only an explicit JWT `admin` role may cross owners. Unauthorized and
        legacy unowned sandboxes return `404` without revealing ownership.
      operationId: getQuotas
      responses:
        '200':
          description: Quota status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuotaStatusResponse'
        '401':
          description: Authentication required when API keys are configured
        '500':
          $ref: '#/components/responses/InternalError'

  /run:
    post:
      tags: [Run]
      summary: Run a command in a temporary sandbox
      description: |
        Executes a command in an isolated sandbox and returns the output.
        The sandbox is automatically cleaned up after execution.

        By default, uses a pre-warmed container pool for fast execution (~50ms).
        Set `fast: false` for custom images or advanced options (~500ms).
      operationId: runCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              simple:
                summary: Simple echo command
                value:
                  command: ["echo", "hello world"]
              python:
                summary: Run Python code
                value:
                  command: ["python3", "-c", "print('Hello from Python!')"]
              custom_image:
                summary: Custom image (slow path)
                value:
                  command: ["node", "--version"]
                  image: "node:22-alpine"
                  fast: false
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks:
    post:
      tags: [Tasks]
      summary: Submit an agent task
      description: Queues a prompt for the selected sandbox. Execution is handled by the task worker.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
            example:
              prompt: "Inspect the failing test"
              sandbox: "sandbox-1"
      responses:
        '201':
          description: Task queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
    get:
      tags: [Tasks]
      summary: List agent tasks
      description: Returns the newest 200 tasks first.
      operationId: listTasks
      responses:
        '200':
          description: Tasks returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /tasks/{task_id}:
    parameters:
      - name: task_id
        in: path
        required: true
        description: Task UUID
        schema:
          type: string
          format: uuid
    get:
      tags: [Tasks]
      summary: Inspect an agent task
      operationId: getTask
      responses:
        '200':
          description: Task found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      tags: [Tasks]
      summary: Cancel an agent task
      description: Cancels queued or running work. Cancellation is idempotent for an already-cancelled task.
      operationId: cancelTask
      responses:
        '200':
          description: Task cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Task has already reached a terminal status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /status:
    get:
      tags: [Health]
      summary: Server status
      description: Returns server version, backend, and whether API key auth is configured.
      operationId: getStatus
      security: []
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /stats:
    get:
      tags: [Health]
      summary: Server statistics
      description: |
        Returns current sandbox count, resource usage (CPU, memory, disk),
        and server metadata. Designed for fleet load-balancing decisions.
      operationId: getStats
      security: []
      responses:
        '200':
          description: Server statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      sandbox_count: 12
                      sandbox_limit: 0
                      backend: "docker"
                      uptime_seconds: 3600
                      version: "0.15.0"
                      resource_usage:
                        cpu_percent: 65.2
                        memory_used_mb: 8192
                        memory_total_mb: 16384
                        disk_used_mb: 4096

  /events:
    get:
      tags: [Events]
      summary: Stream sandbox lifecycle events via SSE
      description: |
        Server-Sent Events (SSE) endpoint that streams sandbox lifecycle events
        in real-time. No authentication required. Returns events for up to 30
        seconds or 100 events, whichever comes first.

        Events include: `sandbox.created`, `sandbox.exec.completed`, `sandbox.deleted`.

        Requires the server to be started with `--webhook-url` or `--otel-endpoint`
        to enable the event bus.
      operationId: streamEvents
      parameters:
        - name: sandbox
          in: query
          description: Filter events to a specific sandbox name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                created:
                  value: |
                    event: sandbox.created
                    data: {"event":"sandbox.created","timestamp":"2026-02-23T12:00:00Z","sandbox":"my-sandbox","labels":{},"metadata":{"image":"alpine:3.24","backend":"docker","vcpus":1,"memory_mb":512,"duration_ms":150}}
        '503':
          description: Event bus not enabled

  /gc:
    post:
      tags: [Sandboxes]
      summary: Garbage-collect expired sandboxes
      description: Removes sandboxes that have exceeded their time-to-live. Enterprise deployments require an administrator identity.
      operationId: garbageCollect
      responses:
        '200':
          description: GC result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcResponse'
        '403':
          description: Enterprise fleet garbage collection requires an administrator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /lifecycle/reconcile:
    post:
      tags: [Sandboxes]
      summary: Reconcile sandbox lifecycle policies
      description: |
        Evaluates lifecycle policies for all sandboxes and applies any needed
        stop/archive/delete actions. Supports dry-run mode for previews.
        Enterprise deployments require an administrator identity.
      operationId: reconcileLifecycle
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReconcileLifecycleRequest'
            examples:
              apply:
                summary: Apply actions
                value: {}
              dry_run:
                summary: Preview actions only
                value:
                  dry_run: true
      responses:
        '200':
          description: Lifecycle reconciliation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LifecycleReconcileResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Enterprise lifecycle reconciliation requires an administrator identity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes:
    get:
      tags: [Sandboxes]
      summary: List all sandboxes
      description: |
        Returns a list of all sandboxes and their current status.
        Supports filtering by labels using `?label=key:value` query parameters.
        Multiple label filters are ANDed together.
      operationId: listSandboxes
      parameters:
        - name: label
          in: query
          description: |
            Filter by label (format: `key:value`). Can be repeated for AND logic.
            Note: uses `:` separator in HTTP (not `=` like CLI) to avoid URL encoding issues.
          schema:
            type: string
          example: "env:prod"
      responses:
        '200':
          description: List of sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Sandboxes]
      summary: Create a new sandbox
      description: |
        Creates a new persistent sandbox. The sandbox starts automatically
        after creation. Use this for workflows that require multiple commands.
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
            examples:
              default:
                summary: Default Alpine sandbox
                value:
                  name: "my-sandbox"
              with_labels:
                summary: Sandbox with labels
                value:
                  name: "eval-sandbox"
                  image: "python:3.12-alpine"
                  labels:
                    scenario: "drift_s3"
                    model: "sonnet"
                    eval_run: "pr-123"
                  description: "Drift scenario evaluation"
              managed_network:
                summary: Docker/Podman managed bridge
                value:
                  name: "dev-sandbox"
                  backend: "docker"
                  network:
                    name: "agentkernel-dev"
                    subnet: "172.30.0.0/24"
                    gateway: "172.30.0.1"
                    dns: ["1.1.1.1"]
      responses:
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          description: Requested backend is unavailable on this server
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /backends:
    get:
      tags: [Sandboxes]
      summary: Discover sandbox backends
      description: |
        Reports the backend selected by Automatic creation and every backend
        known to this server, including readiness and capability information.
        The endpoint does not require a sandbox manager to be initialized.
      operationId: listBackends
      responses:
        '200':
          description: Backend discovery result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BackendDiscoveryResponse'

  /sandboxes/{name}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    get:
      tags: [Sandboxes]
      summary: Get sandbox details
      description: Returns details about a specific sandbox.
      operationId: getSandbox
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Sandboxes]
      summary: Update sandbox metadata
      description: Update labels and/or description for a sandbox.
      operationId: updateSandbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSandboxRequest'
            examples:
              labels:
                summary: Update labels
                value:
                  labels:
                    env: "staging"
                    team: "ml"
              description:
                summary: Update description
                value:
                  description: "Production evaluation sandbox"
      responses:
        '200':
          description: Sandbox updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Sandboxes]
      summary: Delete a sandbox
      description: Stops and removes a sandbox.
      operationId: deleteSandbox
      responses:
        '200':
          description: Sandbox deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/start:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      tags: [Sandboxes]
      summary: Start a stopped sandbox
      description: |
        Starts a stopped sandbox. Omit the optional request body to use the
        historical defaults (moderate permissions and no injected files). The
        local CLI may select a private persisted configuration when delegating
        a Firecracker VM to the long-running server. Capability values are
        derived by the server and cannot be supplied in this request.
      operationId: startSandbox
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSandboxRequest'
      responses:
        '200':
          description: Sandbox started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sandboxes/{name}/stop:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      tags: [Sandboxes]
      summary: Stop a running sandbox
      description: |
        Stops the sandbox while retaining its persisted configuration. The
        long-running server owns the lifecycle task after accepting the
        request, so an HTTP waiter disconnect does not cancel the stop. Use
        full-state pause instead when Firecracker memory, processes, and the
        writable disk must survive.
      operationId: stopSandbox
      responses:
        '200':
          description: Sandbox stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sandboxes/{name}/pause:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      tags: [Sandboxes]
      summary: Pause a running Firecracker sandbox
      description: |
        Captures a durable full-VM checkpoint, including guest memory and
        process state, then stops the Firecracker VM. This operation is only
        supported by the Firecracker backend on x86_64 Linux/KVM. Enterprise policy
        requires the Run action.
      operationId: pauseSandbox
      responses:
        '200':
          description: Sandbox paused
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The sandbox backend does not support full-state pause
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sandboxes/{name}/resume:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      tags: [Sandboxes]
      summary: Resume a paused Firecracker sandbox
      description: Restores guest memory, processes, devices, and disk state from the sandbox's full-VM checkpoint. Enterprise policy requires the Run action.
      operationId: resumeSandbox
      responses:
        '200':
          description: Sandbox resumed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The sandbox backend does not support full-state resume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sandboxes/{name}/fork:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      tags: [Sandboxes]
      summary: Fork a paused Firecracker sandbox
      description: |
        Restores the paused source checkpoint into a new running sandbox. The
        source remains paused and may be resumed or forked again.

        Security warning: the fork copies guest memory and filesystem state.
        Credentials captured in the checkpoint are duplicated and should be
        rotated or revoked when appropriate. Enterprise policy requires Run on
        the source plus Create and Run for the child.
      operationId: forkSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForkSandboxRequest'
            example:
              as_name: experiment-b
      responses:
        '201':
          description: Running sandbox forked from the paused source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ForkSandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: The requested fork would cross an owner or tenant boundary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          description: The sandbox backend does not support full-state fork
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /sandboxes/{name}/resize:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
    post:
      tags: [Sandboxes]
      summary: Resize a sandbox
      operationId: resizeSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResizeSandboxRequest'
      responses:
        '200':
          description: Sandbox resized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/QuotaExceeded'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/by-uuid/{uuid}:
    parameters:
      - $ref: '#/components/parameters/SandboxUUID'

    get:
      tags: [Sandboxes]
      summary: Get sandbox details by UUID
      description: Returns details about a specific sandbox by UUIDv7.
      operationId: getSandboxByUuid
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
