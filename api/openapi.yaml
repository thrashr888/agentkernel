openapi: 3.1.0
info:
  title: agentkernel API
  description: |
    HTTP REST API for managing isolated sandboxes. All commands run in secure,
    isolated containers (Docker/Podman) or microVMs (Firecracker).

    ## Security Model

    - All code execution happens in isolated sandboxes
    - Sandboxes cannot access the host filesystem by default
    - Network access can be restricted per security profile
    - Three security profiles: permissive, moderate (default), restrictive

    ## Authentication

    Authentication is optional. When enabled, use Bearer token in the
    Authorization header.
  version: 0.15.0
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  contact:
    name: agentkernel
    url: https://github.com/thrashr888/agentkernel

servers:
  - url: http://localhost:18888
    description: Local development server

tags:
  - name: Health
    description: Health check endpoint
  - name: Run
    description: One-shot command execution
  - name: Sandboxes
    description: Persistent sandbox management
  - name: Files
    description: File operations inside sandboxes
  - name: Batch
    description: Parallel batch execution
  - name: Snapshots
    description: Snapshot and restore operations
  - name: Objects
    description: Durable object management (stateful sandbox actors)
  - name: Schedules
    description: Schedule management (timed triggers)
  - name: Stores
    description: Durable store management (sqlite, kv, queue)
  - name: Events
    description: Real-time sandbox lifecycle event stream

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      description: Returns 200 if the server is healthy.
      operationId: healthCheck
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /run:
    post:
      tags: [Run]
      summary: Run a command in a temporary sandbox
      description: |
        Executes a command in an isolated sandbox and returns the output.
        The sandbox is automatically cleaned up after execution.

        By default, uses a pre-warmed container pool for fast execution (~50ms).
        Set `fast: false` for custom images or advanced options (~500ms).
      operationId: runCommand
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              simple:
                summary: Simple echo command
                value:
                  command: ["echo", "hello world"]
              python:
                summary: Run Python code
                value:
                  command: ["python3", "-c", "print('Hello from Python!')"]
              custom_image:
                summary: Custom image (slow path)
                value:
                  command: ["node", "--version"]
                  image: "node:22-alpine"
                  fast: false
      responses:
        '200':
          description: Command executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /status:
    get:
      tags: [Health]
      summary: Server status
      description: Returns server version, backend, and whether API key auth is configured.
      operationId: getStatus
      responses:
        '200':
          description: Server status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusResponse'

  /stats:
    get:
      tags: [Health]
      summary: Server statistics
      description: |
        Returns current sandbox count, resource usage (CPU, memory, disk),
        and server metadata. Designed for fleet load-balancing decisions.
      operationId: getStats
      responses:
        '200':
          description: Server statistics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatsResponse'
              examples:
                default:
                  value:
                    success: true
                    data:
                      sandbox_count: 12
                      sandbox_limit: 0
                      backend: "docker"
                      uptime_seconds: 3600
                      version: "0.15.0"
                      resource_usage:
                        cpu_percent: 65.2
                        memory_used_mb: 8192
                        memory_total_mb: 16384
                        disk_used_mb: 4096

  /events:
    get:
      tags: [Events]
      summary: Stream sandbox lifecycle events via SSE
      description: |
        Server-Sent Events (SSE) endpoint that streams sandbox lifecycle events
        in real-time. No authentication required. Returns events for up to 30
        seconds or 100 events, whichever comes first.

        Events include: `sandbox.created`, `sandbox.exec.completed`, `sandbox.deleted`.

        Requires the server to be started with `--webhook-url` or `--otel-endpoint`
        to enable the event bus.
      operationId: streamEvents
      parameters:
        - name: sandbox
          in: query
          description: Filter events to a specific sandbox name
          required: false
          schema:
            type: string
      responses:
        '200':
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
              examples:
                created:
                  value: |
                    event: sandbox.created
                    data: {"event":"sandbox.created","timestamp":"2026-02-23T12:00:00Z","sandbox":"my-sandbox","labels":{},"metadata":{"image":"alpine:3.20","backend":"docker","vcpus":1,"memory_mb":512,"duration_ms":150}}
        '503':
          description: Event bus not enabled

  /gc:
    post:
      tags: [Sandboxes]
      summary: Garbage-collect expired sandboxes
      description: Removes sandboxes that have exceeded their time-to-live.
      operationId: garbageCollect
      responses:
        '200':
          description: GC result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GcResponse'

  /sandboxes:
    get:
      tags: [Sandboxes]
      summary: List all sandboxes
      description: |
        Returns a list of all sandboxes and their current status.
        Supports filtering by labels using `?label=key:value` query parameters.
        Multiple label filters are ANDed together.
      operationId: listSandboxes
      parameters:
        - name: label
          in: query
          description: |
            Filter by label (format: `key:value`). Can be repeated for AND logic.
            Note: uses `:` separator in HTTP (not `=` like CLI) to avoid URL encoding issues.
          schema:
            type: string
          example: "env:prod"
      responses:
        '200':
          description: List of sandboxes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Sandboxes]
      summary: Create a new sandbox
      description: |
        Creates a new persistent sandbox. The sandbox starts automatically
        after creation. Use this for workflows that require multiple commands.
      operationId: createSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSandboxRequest'
            examples:
              default:
                summary: Default Alpine sandbox
                value:
                  name: "my-sandbox"
              with_labels:
                summary: Sandbox with labels
                value:
                  name: "eval-sandbox"
                  image: "python:3.12-alpine"
                  labels:
                    scenario: "drift_s3"
                    model: "sonnet"
                    eval_run: "pr-123"
                  description: "Drift scenario evaluation"
      responses:
        '201':
          description: Sandbox created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    get:
      tags: [Sandboxes]
      summary: Get sandbox details
      description: Returns details about a specific sandbox.
      operationId: getSandbox
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    patch:
      tags: [Sandboxes]
      summary: Update sandbox metadata
      description: Update labels and/or description for a sandbox.
      operationId: updateSandbox
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchSandboxRequest'
            examples:
              labels:
                summary: Update labels
                value:
                  labels:
                    env: "staging"
                    team: "ml"
              description:
                summary: Update description
                value:
                  description: "Production evaluation sandbox"
      responses:
        '200':
          description: Sandbox updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Sandboxes]
      summary: Delete a sandbox
      description: Stops and removes a sandbox.
      operationId: deleteSandbox
      responses:
        '200':
          description: Sandbox deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/by-uuid/{uuid}:
    parameters:
      - $ref: '#/components/parameters/SandboxUUID'

    get:
      tags: [Sandboxes]
      summary: Get sandbox details by UUID
      description: Returns details about a specific sandbox by UUIDv7.
      operationId: getSandboxByUuid
      responses:
        '200':
          description: Sandbox details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/exec:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    post:
      tags: [Sandboxes]
      summary: Execute command in sandbox
      description: Executes a command in an existing running sandbox.
      operationId: execInSandbox
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExecRequest'
            examples:
              simple:
                summary: List files
                value:
                  command: ["ls", "-la"]
              python:
                summary: Run Python
                value:
                  command: ["python3", "-c", "import sys; print(sys.version)"]
      responses:
        '200':
          description: Command executed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/files/{path}:
    parameters:
      - $ref: '#/components/parameters/SandboxName'
      - name: path
        in: path
        required: true
        description: File path inside the sandbox (relative, e.g. tmp/hello.txt)
        schema:
          type: string

    get:
      tags: [Files]
      summary: Read a file from a sandbox
      operationId: readFile
      responses:
        '200':
          description: File content
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileReadResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    put:
      tags: [Files]
      summary: Write a file to a sandbox
      operationId: writeFile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FileWriteRequest'
            examples:
              text:
                summary: Write text file
                value:
                  content: "hello world"
              base64:
                summary: Write binary file
                value:
                  content: "aGVsbG8="
                  encoding: "base64"
      responses:
        '200':
          description: File written
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Files]
      summary: Delete a file from a sandbox
      operationId: deleteFile
      responses:
        '200':
          description: File deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/logs:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    get:
      tags: [Sandboxes]
      summary: Get sandbox audit logs
      description: Returns audit log entries for this sandbox.
      operationId: getSandboxLogs
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SandboxLogsResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /sandboxes/{name}/extend:
    parameters:
      - $ref: '#/components/parameters/SandboxName'

    post:
      tags: [Sandboxes]
      summary: Extend sandbox TTL
      description: |
        Extends the sandbox's time-to-live by the specified duration.
        If the sandbox has no current TTL, sets expiry from now.
      operationId: extendSandboxTtl
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExtendTtlRequest'
            examples:
              default:
                summary: Extend by 1 hour (default)
                value: {}
              custom:
                summary: Extend by 30 minutes
                value:
                  by: "30m"
      responses:
        '200':
          description: TTL extended
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendTtlResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots:
    get:
      tags: [Snapshots]
      summary: List all snapshots
      description: Returns a list of all saved snapshots.
      operationId: listSnapshots
      responses:
        '200':
          description: List of snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotListResponse'
        '500':
          $ref: '#/components/responses/InternalError'

    post:
      tags: [Snapshots]
      summary: Take a snapshot
      description: |
        Creates a snapshot of a sandbox's current state.
        Uses Docker commit internally.
      operationId: takeSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeSnapshotRequest'
            examples:
              simple:
                summary: Snapshot a sandbox
                value:
                  sandbox: "my-sandbox"
                  name: "checkpoint-1"
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots/{name}:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the snapshot
        schema:
          type: string

    get:
      tags: [Snapshots]
      summary: Get snapshot info
      description: Returns information about a specific snapshot.
      operationId: getSnapshot
      responses:
        '200':
          description: Snapshot details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

    delete:
      tags: [Snapshots]
      summary: Delete a snapshot
      description: Removes the snapshot and its Docker image.
      operationId: deleteSnapshot
      responses:
        '200':
          description: Snapshot deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /snapshots/{name}/restore:
    parameters:
      - name: name
        in: path
        required: true
        description: Name of the snapshot to restore
        schema:
          type: string

    post:
      tags: [Snapshots]
      summary: Restore from snapshot
      description: |
        Creates a new sandbox from a snapshot.
        Defaults to naming the restored sandbox "{original}-restored".
      operationId: restoreSnapshot
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestoreSnapshotRequest'
            examples:
              default:
                summary: Restore with default name
                value: {}
              custom:
                summary: Restore with custom name
                value:
                  as_name: "my-restored-sandbox"
      responses:
        '200':
          description: Sandbox restored
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RestoreSnapshotResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

  /batch/run:
    post:
      tags: [Batch]
      summary: Run multiple commands in parallel
      description: |
        Executes multiple commands in parallel, each in its own temporary sandbox.
        Results are returned in the same order as the input commands.
      operationId: batchRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRunRequest'
            examples:
              simple:
                summary: Two echo commands
                value:
                  commands:
                    - command: ["echo", "hello"]
                    - command: ["echo", "world"]
      responses:
        '200':
          description: Batch results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchRunResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'

  /objects:
    get:
      tags: [Objects]
      summary: List durable objects
      description: Returns all non-deleted durable objects.
      responses:
        '200':
          description: List of objects
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DurableObject'
    post:
      tags: [Objects]
      summary: Create a durable object
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDurableObject'
      responses:
        '201':
          description: Object created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DurableObject'
        '400':
          $ref: '#/components/responses/BadRequest'

  /objects/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Objects]
      summary: Get durable object by id
      responses:
        '200':
          description: Object found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DurableObject'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Objects]
      summary: Partially update a durable object
      description: Update storage and/or status of a durable object.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchDurableObject'
      responses:
        '200':
          description: Object updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DurableObject'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Objects]
      summary: Delete a durable object
      responses:
        '200':
          description: Object deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /objects/{class}/{object_id}/call/{method}:
    parameters:
      - name: class
        in: path
        required: true
        schema:
          type: string
      - name: object_id
        in: path
        required: true
        schema:
          type: string
      - name: method
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Objects]
      summary: Call a method on a durable object
      description: |
        Invokes a method on a durable object. Auto-creates the object if it
        does not exist and wakes it from hibernation if needed.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Method arguments (arbitrary JSON)
      responses:
        '200':
          description: Method result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    description: Method return value
        '500':
          $ref: '#/components/responses/InternalError'

  /stores:
    get:
      tags: [Stores]
      summary: List durable stores
      description: Returns all durable stores.
      responses:
        '200':
          description: List of stores
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DurableStore'
    post:
      tags: [Stores]
      summary: Create a durable store
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDurableStore'
      responses:
        '201':
          description: Store created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DurableStore'
        '400':
          $ref: '#/components/responses/BadRequest'

  /stores/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Stores]
      summary: Get durable store by id
      responses:
        '200':
          description: Store found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/DurableStore'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Stores]
      summary: Delete a durable store
      responses:
        '200':
          description: Store deleted
        '404':
          $ref: '#/components/responses/NotFound'

  /stores/{id}/query:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Stores]
      summary: Run a read query against a store
      description: Execute a read-only query (e.g. SQL SELECT for sqlite stores).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                  description: SQL query (for sqlite stores)
                params:
                  type: array
                  description: Query parameters
      responses:
        '200':
          description: Query results
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StoreQueryResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /stores/{id}/execute:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    post:
      tags: [Stores]
      summary: Run a write statement against a store
      description: Execute a write statement (e.g. SQL INSERT/UPDATE/DELETE for sqlite stores).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sql:
                  type: string
                  description: SQL statement (for sqlite stores)
                params:
                  type: array
                  description: Statement parameters
      responses:
        '200':
          description: Execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/StoreExecuteResult'
        '404':
          $ref: '#/components/responses/NotFound'

  /schedules:
    get:
      tags: [Schedules]
      summary: List schedules
      description: Returns all schedules.
      responses:
        '200':
          description: List of schedules
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Schedule'
    post:
      tags: [Schedules]
      summary: Create a schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSchedule'
      responses:
        '201':
          description: Schedule created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Schedule'
        '400':
          $ref: '#/components/responses/BadRequest'

  /schedules/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      tags: [Schedules]
      summary: Get schedule by id
      responses:
        '200':
          description: Schedule found
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    $ref: '#/components/schemas/Schedule'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Schedules]
      summary: Delete a schedule
      responses:
        '200':
          description: Schedule deleted
        '404':
          $ref: '#/components/responses/NotFound'

components:
  schemas:
    RunRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
          example: ["echo", "hello"]
        image:
          type: string
          description: |
            Docker image to use (only when fast=false).
            If not specified, auto-detected from command.
          example: "python:3.12-alpine"
        profile:
          type: string
          enum: [permissive, moderate, restrictive]
          default: moderate
          description: |
            Security profile (only when fast=false).
            - permissive: network, mounts, env passthrough
            - moderate: network enabled, no mounts
            - restrictive: no network, read-only filesystem
        fast:
          type: boolean
          default: true
          description: |
            Use container pool for fast execution (~50ms).
            Set to false for custom images or profiles (~500ms).

    CreateSandboxRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
          maxLength: 64
          description: Unique name for the sandbox
          example: "my-sandbox"
        image:
          type: string
          default: "alpine:3.20"
          description: Docker image to use
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          default: 1
          description: Number of virtual CPUs
        memory_mb:
          type: integer
          default: 512
          description: Memory in megabytes
        profile:
          type: string
          enum: [permissive, moderate, restrictive]
          description: Security profile
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined labels for fleet management and filtering
          example:
            env: "prod"
            team: "ml"
        description:
          type: string
          description: User-defined description

    PatchSandboxRequest:
      type: object
      properties:
        labels:
          type: object
          additionalProperties:
            type: string
          description: Replace all labels
        description:
          type: string
          description: Update description

    ExecRequest:
      type: object
      required: [command]
      properties:
        command:
          type: array
          items:
            type: string
          description: Command and arguments to execute
          example: ["ls", "-la"]

    HealthResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: "ok"

    RunResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            output:
              type: string
              description: Combined stdout/stderr from command
              example: "hello world\n"

    StatusResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            version:
              type: string
              example: "0.15.0"
            backend:
              type: string
              example: "docker"
            api_key_configured:
              type: boolean
              example: false

    StatsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sandbox_count:
              type: integer
              example: 12
            sandbox_limit:
              type: integer
              example: 0
              description: 0 means unlimited
            backend:
              type: string
              example: "docker"
            uptime_seconds:
              type: integer
              example: 3600
            version:
              type: string
              example: "0.15.0"
            resource_usage:
              type: object
              properties:
                cpu_percent:
                  type: number
                  format: float
                  example: 65.2
                memory_used_mb:
                  type: integer
                  example: 8192
                memory_total_mb:
                  type: integer
                  example: 16384
                disk_used_mb:
                  type: integer
                  example: 4096

    GcResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            removed:
              type: array
              items:
                type: string
              description: Names of removed sandboxes
              example: ["old-sandbox-1", "expired-test"]

    SandboxInfo:
      type: object
      required: [name, uuid, status, backend]
      properties:
        name:
          type: string
          example: "my-sandbox"
        uuid:
          type: string
          format: uuid
          description: Globally unique sandbox identifier (UUIDv7)
          example: "019abc12-1234-7def-89ab-0123456789ab"
        status:
          type: string
          enum: [running, stopped]
          example: "running"
        backend:
          type: string
          example: "docker"
        image:
          type: string
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          example: 1
        memory_mb:
          type: integer
          example: 512
        created_at:
          type: string
          example: "2026-01-30T12:00:00Z"
        labels:
          type: object
          additionalProperties:
            type: string
          description: User-defined labels
        description:
          type: string
          description: User-defined description

    SandboxResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SandboxInfo'

    SandboxListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SandboxInfo'

    SuccessResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: string
          example: "Sandbox removed"

    ErrorResponse:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: string
          example: "Sandbox not found"

    FileWriteRequest:
      type: object
      required: [content]
      properties:
        content:
          type: string
          description: File content (text or base64-encoded)
        encoding:
          type: string
          enum: [utf8, base64]
          default: utf8
          description: Content encoding

    FileReadResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            content:
              type: string
              description: File content
            encoding:
              type: string
              enum: [utf8, base64]
            size:
              type: integer
              description: File size in bytes

    BatchRunRequest:
      type: object
      required: [commands]
      properties:
        commands:
          type: array
          items:
            type: object
            required: [command]
            properties:
              command:
                type: array
                items:
                  type: string
                description: Command and arguments

    BatchRunResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            results:
              type: array
              items:
                type: object
                properties:
                  output:
                    type: string
                    nullable: true
                  error:
                    type: string
                    nullable: true

    SandboxLogsResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            type: object
            description: Audit log entry

    ExtendTtlRequest:
      type: object
      properties:
        by:
          type: string
          default: "1h"
          description: Duration to extend by (e.g., "1h", "30m", "2d")
          example: "1h"

    ExtendTtlResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            expires_at:
              type: string
              nullable: true
              description: New expiry time in RFC3339 format
              example: "2026-02-05T15:00:00Z"

    SnapshotInfo:
      type: object
      properties:
        name:
          type: string
          example: "checkpoint-1"
        sandbox:
          type: string
          description: Original sandbox name
          example: "my-sandbox"
        image_tag:
          type: string
          description: Docker image tag for the snapshot
          example: "agentkernel-snap:checkpoint-1"
        backend:
          type: string
          example: "docker"
        base_image:
          type: string
          example: "python:3.12-alpine"
        vcpus:
          type: integer
          example: 2
        memory_mb:
          type: integer
          example: 512
        created_at:
          type: string
          example: "2026-02-05T12:00:00Z"

    SnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/SnapshotInfo'

    SnapshotListResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: array
          items:
            $ref: '#/components/schemas/SnapshotInfo'

    TakeSnapshotRequest:
      type: object
      required: [sandbox, name]
      properties:
        sandbox:
          type: string
          description: Name of the sandbox to snapshot
          example: "my-sandbox"
        name:
          type: string
          description: Name for the snapshot
          example: "checkpoint-1"

    RestoreSnapshotRequest:
      type: object
      properties:
        as_name:
          type: string
          description: Name for the restored sandbox (defaults to original + "-restored")
          example: "my-restored-sandbox"

    RestoreSnapshotResponse:
      type: object
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            sandbox:
              type: string
              description: Name of the restored sandbox
              example: "my-sandbox-restored"
            from_snapshot:
              type: string
              description: Snapshot that was restored
              example: "checkpoint-1"

  parameters:
    SandboxName:
      name: name
      in: path
      required: true
      description: Name of the sandbox
      schema:
        type: string
        pattern: '^[a-zA-Z0-9][a-zA-Z0-9_-]*$'
    SandboxUUID:
      name: uuid
      in: path
      required: true
      description: Sandbox UUID (UUIDv7)
      schema:
        type: string
        format: uuid

    DurableObject:
      type: object
      properties:
        id:
          type: string
          format: uuid
        class:
          type: string
        object_id:
          type: string
        status:
          type: string
          enum: [active, hibernating, deleted]
        sandbox:
          type: string
          nullable: true
        storage:
          type: object
        idle_timeout_seconds:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDurableObject:
      type: object
      required: [class, object_id]
      properties:
        class:
          type: string
        object_id:
          type: string
        sandbox:
          type: string
        storage:
          type: object
        idle_timeout_seconds:
          type: integer
          default: 300

    Schedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cron:
          type: string
          nullable: true
        fire_at:
          type: string
          format: date-time
          nullable: true
        method:
          type: string
        args:
          type: object
        target_class:
          type: string
          nullable: true
        target_object_id:
          type: string
          nullable: true
        target_orchestration:
          type: string
          nullable: true
        status:
          type: string
          enum: [active, paused, completed]
        last_fired_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    PatchDurableObject:
      type: object
      properties:
        storage:
          type: object
          description: Replace the object's storage (arbitrary JSON)
        status:
          type: string
          enum: [active, hibernating]
          description: Set the object status

    DurableStore:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        kind:
          type: string
          enum: [sqlite, kv, queue]
        sandbox:
          type: string
          nullable: true
        config:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateDurableStore:
      type: object
      required: [name, kind]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [sqlite, kv, queue]
        sandbox:
          type: string
        config:
          type: object

    StoreQueryResult:
      type: object
      properties:
        columns:
          type: array
          items:
            type: string
        rows:
          type: array
          items:
            type: array
        row_count:
          type: integer

    StoreExecuteResult:
      type: object
      properties:
        rows_affected:
          type: integer

    CreateSchedule:
      type: object
      required: [name, method]
      properties:
        name:
          type: string
        cron:
          type: string
          description: Cron expression (mutually exclusive with fire_at)
        fire_at:
          type: string
          format: date-time
          description: One-shot fire time (mutually exclusive with cron)
        method:
          type: string
        args:
          type: object
        target_class:
          type: string
        target_object_id:
          type: string
        target_orchestration:
          type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "command is required"

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Sandbox not found"

    InternalError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            success: false
            error: "Failed to start container"

  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Optional API key authentication. When enabled, include the
        API key in the Authorization header as a Bearer token.

# Security is optional - uncomment to require authentication
# security:
#   - BearerAuth: []
