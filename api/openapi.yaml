    post:
      tags: [Snapshots]
      summary: Take a snapshot
      description: |
        Creates a snapshot of a sandbox's current state.
        Uses Docker commit internally.
      operationId: takeSnapshot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TakeSnapshotRequest'
            examples:
              simple:
                summary: Snapshot a sandbox
                value:
                  sandbox: "my-sandbox"
                  name: "checkpoint-1"
      responses:
        '200':
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'

