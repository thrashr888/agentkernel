# Gemini CLI sandbox template
# Pre-configured for running Gemini CLI inside an isolated sandbox

[sandbox]
name = "gemini-sandbox"
base_image = "node:22-alpine"

[agent]
preferred = "gemini"
compatibility_mode = "gemini"

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"

[security.domains]
allow = ["generativelanguage.googleapis.com"]
