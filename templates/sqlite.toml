# SQLite sandbox template
# Lightweight sandbox with sqlite3 CLI available.

[sandbox]
name = "sqlite"
base_image = "alpine:3.20"
init_script = """
set -e
apk add --no-cache sqlite
mkdir -p /workspace/data
"""

[resources]
vcpus = 1
memory_mb = 512

[security]
profile = "moderate"

[template]
help_text = """
Description: Template 'sqlite' sandbox profile.
How to use: Start the sandbox, then run sqlite commands like: sqlite /workspace/data/app.db
Example command: sqlite /workspace/data/app.db "SELECT 1;"
Binaries available: sqlite
Services and ports: No background service required; SQLite uses a local file.
"""
