# OpenClaw sandbox template
# Self-hosted personal AI assistant with multi-channel messaging
# Gateway at http://localhost:18789 after starting
# https://github.com/openclaw/openclaw

[sandbox]
name = "openclaw"
base_image = "node:22-slim"
init_script = """
set -e
apt-get update -qq && apt-get install -y -qq git curl >/dev/null
corepack enable
corepack prepare pnpm@latest --activate
npm install -g openclaw@latest
"""

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"
network = true
mount_cwd = true

[security.domains]
allow = ["registry.npmjs.org", "api.anthropic.com", "api.openai.com"]

[ports]
# OpenClaw gateway WebSocket control plane
18789 = 18789

[template]
help_text = """
How to use: Start the sandbox, then run `openclaw onboard --install-daemon` to configure.
Example command: openclaw --version
Binaries available: node, npm, npx, pnpm, openclaw
Services and ports: Gateway runs on port 18789 (WebSocket control plane).
"""
