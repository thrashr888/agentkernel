# Claude Code sandbox template
# Pre-configured for running Claude Code inside an isolated sandbox

[sandbox]
name = "claude-sandbox"
base_image = "node:22-alpine"
init_script = """
set -e
npm install -g @anthropic-ai/claude-code
"""

[agent]
preferred = "claude"
compatibility_mode = "claude"

[resources]
vcpus = 2
memory_mb = 1024

[secrets]
ANTHROPIC_API_KEY = "api.anthropic.com"

[security]
profile = "moderate"

[security.domains]
allow = ["api.anthropic.com", "sentry.io"]

[template]
description = "Claude Code agent sandbox"
category = "Agent Sandboxes"
help_text = """
How to use: Start the sandbox and run your workflow inside /workspace.
Example command: ls -la /workspace
Binaries available: node, npm, npx, claude
Services and ports: No long-running service is configured by default; only explicitly mapped ports are exposed.
"""
