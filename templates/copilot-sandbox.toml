# Copilot CLI sandbox template
# Pre-configured for running GitHub Copilot CLI inside an isolated sandbox

[sandbox]
name = "copilot-sandbox"
base_image = "node:22-alpine"

[agent]
preferred = "copilot"
compatibility_mode = "native"

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"

[security.domains]
allow = ["api.github.com", "copilot-proxy.githubusercontent.com"]
