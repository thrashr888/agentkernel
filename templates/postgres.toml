# Postgres sandbox template
# Postgres server image for local development and testing.

[sandbox]
name = "postgres"
base_image = "postgres:17-alpine"

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"
network = true

[ports]
5432 = 5432

[environment]
POSTGRES_DB = "app"
POSTGRES_USER = "app"
POSTGRES_PASSWORD = "app"

[template]
help_text = """
Description: Template 'postgres' sandbox profile.
How to use: Start the sandbox, then connect with: psql -h 127.0.0.1 -U app -d app (use psql, not pgsql).
Binaries available: postgres, psql, pg_isready
Services and ports: PostgreSQL listens on 5432/tcp.
"""
