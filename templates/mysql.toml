# MySQL sandbox template
# MySQL server image for local development and testing.

[sandbox]
name = "mysql"
base_image = "mysql:8.4"
init_script = """
set -e

if ! mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
  MYSQL_ALLOW_EMPTY_PASSWORD=yes nohup docker-entrypoint.sh mysqld >/tmp/mysql.log 2>&1 &
  for _ in $(seq 1 45); do
    if mysqladmin ping -h 127.0.0.1 --silent >/dev/null 2>&1; then
      break
    fi
    sleep 1
  done
fi
"""

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"
network = true

[ports]
3306 = 3306

[template]
help_text = """
Description: Template 'mysql' sandbox profile.
How to use: MySQL is started by the init script when the sandbox boots. If needed, start manually with: MYSQL_ALLOW_EMPTY_PASSWORD=yes docker-entrypoint.sh mysqld &
Example command: mysql -h 127.0.0.1 -u root -e "SELECT VERSION();"
Binaries available: mysql, mysqld
Services and ports: MySQL listens on 3306/tcp.
"""
