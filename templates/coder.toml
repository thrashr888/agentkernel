# Coder code-server sandbox template
# Browser-based VS Code IDE using code-server
# Access at http://localhost:8080 after starting

[sandbox]
name = "coder"
base_image = "codercom/code-server:latest"

[resources]
vcpus = 2
memory_mb = 2048

[security]
profile = "moderate"
network = true
mount_cwd = true

[ports]
# code-server web interface
8080 = 8080

[environment]
# Disable password auth for local dev (set PASSWORD env var in production)
PASSWORD = ""

[template]
help_text = """
Description: Template 'coder' sandbox profile.
How to use: Start the sandbox and open the mapped web port in your browser.
Example command: ls -la /workspace
Binaries available: code-server
Services and ports: code-server web UI uses its default HTTP port from the image.
"""
