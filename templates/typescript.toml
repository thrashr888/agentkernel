# TypeScript sandbox template
# Node.js LTS for TypeScript development

[sandbox]
name = "typescript"
base_image = "node:22-alpine"

[resources]
vcpus = 1
memory_mb = 512

[security]
profile = "moderate"

[security.domains]
allow = ["registry.npmjs.org"]

[template]
help_text = """
Description: Template 'typescript' sandbox profile.
How to use: Start the sandbox and run your workflow inside /workspace.
Binaries available: node, npm, npx
Services and ports: No long-running service is configured by default; only explicitly mapped ports are exposed.
"""
