# OpenAI Codex sandbox template
# Pre-configured for running Codex CLI inside an isolated sandbox

[sandbox]
name = "codex-sandbox"
base_image = "node:22-alpine"

[agent]
preferred = "codex"
compatibility_mode = "codex"

[resources]
vcpus = 2
memory_mb = 1024

[secrets]
OPENAI_API_KEY = "api.openai.com"

[security]
profile = "moderate"

[security.domains]
allow = ["api.openai.com"]

[template]
help_text = """
How to use: Start the sandbox and run your workflow inside /workspace.
Example command: ls -la /workspace
Binaries available: node, npm, npx
Services and ports: No long-running service is configured by default; only explicitly mapped ports are exposed.
"""
