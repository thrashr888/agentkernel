[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agentkernel-sdk"
version = "0.3.0"
description = "Python SDK for agentkernel — run AI coding agents in secure, isolated microVMs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Paul Thrasher", email = "thrashr888@gmail.com" }]
keywords = ["agentkernel", "sandbox", "microvm", "ai", "agent", "firecracker"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = ["httpx>=0.28.1", "httpx-sse>=0.4.3", "pydantic>=2.13.4"]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-httpx>=0.36.2",
    "mypy>=2.3.1",
    "ruff>=0.16.4",
]

[project.urls]
Homepage = "https://github.com/thrashr888/agentkernel"
Repository = "https://github.com/thrashr888/agentkernel/tree/main/sdk/python"

[tool.hatch.build.targets.wheel]
packages = ["src/agentkernel"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# This module embeds the canonical browser JavaScript and server scripts verbatim.
"src/agentkernel/browser.py" = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: requires running agentkernel server"]
