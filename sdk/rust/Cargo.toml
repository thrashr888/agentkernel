[package]
name = "agentkernel-sdk"
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
description = "Rust SDK for agentkernel — run AI coding agents in secure, isolated microVMs"
license = "MIT"
repository = "https://github.com/thrashr888/agentkernel/tree/main/sdk/rust"
homepage = "https://github.com/thrashr888/agentkernel"
keywords = ["agentkernel", "sandbox", "microvm", "ai", "firecracker"]
categories = ["api-bindings", "development-tools"]

[dependencies]
reqwest = { version = "0.13.4", features = ["json", "stream"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.1", features = ["rt", "macros"] }
thiserror = "2.0.20"
futures = "0.3.34"
eventsource-stream = "0.2.3"
base64 = "0.23.1"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
