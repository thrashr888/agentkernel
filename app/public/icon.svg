<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!-- White background with rounded corners (macOS style) -->
  <rect width="1024" height="1024" rx="180" fill="white"/>

  <!--
    AK Monogram - the right vertical bar of A is shared with the left stem of K
    All elements use consistent ~80px visual stroke width.
  -->

  <g fill="black">
    <!-- Shared vertical bar (A's right leg = K's stem) -->
    <rect x="420" y="160" width="80" height="704"/>

    <!-- A: left leg (angled from bottom-left to apex) -->
    <polygon points="120,864 420,160 500,160 200,864"/>

    <!-- A: crossbar -->
    <rect x="225" y="548" width="275" height="72"/>

    <!-- K: upper arm (parallelogram, constant width)
         Goes from stem at y~512 up-right to y~160 area.
         Using 4 corners of a parallelogram:
         Bottom-left:  (500, 545)  - on stem right edge, below junction
         Top-left:     (500, 465)  - on stem right edge, above junction
         Top-right:    (860, 160)  - tip top
         Bottom-right: (860, 240)  - tip bottom
         Width at tip: 80px vertical, which when projected perpendicular is ~80px stroke.
    -->
    <polygon points="500,465 860,160 860,240 500,545"/>

    <!-- K: lower leg (parallelogram, mirror of upper arm)
         Mirror the upper arm about y=512:
         Top-left:     (500, 479)  [512-(545-512)=479]
         Bottom-left:  (500, 559)  [512+(512-465)=559]
         Bottom-right: (860, 864)  [512+(512-160)=864]
         Top-right:    (860, 784)  [512+(512-240)=784]
    -->
    <polygon points="500,479 500,559 860,864 860,784"/>
  </g>
</svg>
