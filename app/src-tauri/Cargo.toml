[package]
name = "agentkernel-desktop"
version = "0.19.0"
description = "Desktop control plane for agentkernel"
authors = ["Paul Thrasher <thrashr888@gmail.com>"]
license = "MIT"
edition = "2021"
rust-version = "1.89"

[lib]
name = "agentkernel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.3.5"
tauri-plugin-window-state = "2.4.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
reqwest = { version = "0.13", features = ["json"] }
tokio = { version = "1.53.1", features = ["rt", "macros", "sync", "time"] }
anyhow = "1.0.104"
thiserror = "2.0.20"
base64 = "0.23"
dirs = "6"
toml = "1.1"
url = "2"
which = "8"
cedar-policy = "4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-debug-bridge = { version = "0.5.1", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
debug-bridge = ["tauri-plugin-debug-bridge"]
