[package]
name = "agentkernel-desktop"
version = "0.1.0"
description = "Desktop control plane for agentkernel"
authors = ["Paul Thrasher <thrashr888@gmail.com>"]
license = "MIT"
edition = "2021"

[lib]
name = "agentkernel_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2"
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "macros"] }
anyhow = "1"
thiserror = "2"
base64 = "0.22"
dirs = "6"
tauri-plugin-updater = "2"
tauri-plugin-debug-bridge = { version = "0.4", optional = true }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
debug-bridge = ["tauri-plugin-debug-bridge"]
