site_name: agentkernel
site_url: https://thrashr888.github.io/agentkernel/
site_description: Run AI coding agents in secure, isolated microVMs
repo_url: https://github.com/thrashr888/agentkernel
repo_name: thrashr888/agentkernel

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.share
    - content.code.copy

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - admonition
  - pymdownx.details

nav:
  - Home: index.md
  - Getting Started:
    - Installation: installation.md
    - Quick Start: getting-started.md
    - Comparisons: comparisons.md
    - Benchmarks: benchmarks.md
  - Features:
    - Secrets: secrets.md
    - Browser Automation: browser-automation.md
    - Desktop App: desktop-app.md
    - Compliance Mapping: compliance-mapping.md
  - Commands:
    - Overview: commands.md
    - run: cmd-run.md
    - create: cmd-create.md
    - start / stop: cmd-start-stop.md
    - exec / attach: cmd-exec-attach.md
    - list: cmd-list.md
    - secret: cmd-secrets.md
    - images: cmd-images.md
    - volumes: cmd-volumes.md
    - snapshots: cmd-snapshots.md
    - sessions: cmd-sessions.md
    - templates: cmd-templates.md
    - export / import: cmd-export-import.md
    - parallel: cmd-parallel.md
    - pipelines: cmd-pipelines.md
  - Configuration:
    - Overview: configuration.md
    - agentkernel.toml: config-toml.md
    - Security Profiles: config-security.md
    - Backends: config-backends.md
  - AI Agents:
    - Overview: agents.md
    - Claude Code: agent-claude.md
    - OpenAI Codex: agent-codex.md
    - Google Gemini: agent-gemini.md
    - Amp: agent-amp.md
    - OpenCode: agent-opencode.md
    - GitHub Copilot: agent-copilot.md
    - Pi: agent-pi.md
  - API:
    - Overview: api.md
    - HTTP API: api-http.md
    - OpenAPI Spec: api-openapi.md
    - MCP Server: api-mcp.md
  - SDKs:
    - Overview: sdks.md
    - Node.js: sdk-nodejs.md
    - Python: sdk-python.md
    - Go: sdk-golang.md
    - Rust: sdk-rust.md
    - Swift: sdk-swift.md
  - Operations:
    - Overview: orchestration.md
    - Kubernetes: orchestration-kubernetes.md
    - Nomad: orchestration-nomad.md
    - Deployment: deploy.md
  - Changelog: changelog.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/thrashr888/agentkernel
    - icon: fontawesome/brands/npm
      link: https://www.npmjs.com/package/agentkernel
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/agentkernel-sdk/
    - icon: fontawesome/brands/golang
      link: https://pkg.go.dev/github.com/thrashr888/agentkernel/sdk/golang
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/agentkernel-sdk
