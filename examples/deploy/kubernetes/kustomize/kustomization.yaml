# Kustomize deployment for agentkernel
# Usage:
#   kubectl apply -k .

apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: agentkernel

resources:
  - namespace.yaml
  - deployment.yaml
  - service.yaml
  - pvc.yaml

configMapGenerator:
  - name: agentkernel-config
    literals:
      - AGENTKERNEL_HOST=0.0.0.0
      - AGENTKERNEL_PORT=18888
