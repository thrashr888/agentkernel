apiVersion: v1
kind: Service
metadata:
  name: agentkernel
  labels:
    app: agentkernel
spec:
  type: ClusterIP
  ports:
    - port: 18888
      targetPort: 18888
      protocol: TCP
      name: http
  selector:
    app: agentkernel
