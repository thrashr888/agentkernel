# Pi Agent Configuration
#
# Use this config to create a sandbox with Pi pre-installed:
#   agentkernel create my-project --config examples/agents/pi/agentkernel.toml

[sandbox]
name = "pi-sandbox"

[build]
# Build from Dockerfile in this directory
dockerfile = "Dockerfile"

[agent]
preferred = "pi"
compatibility_mode = "native"

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"
network = true      # Pi needs network for LLM API calls
mount_cwd = true    # Mount project directory
