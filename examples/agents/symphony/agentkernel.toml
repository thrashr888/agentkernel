# Symphony Agent Configuration
#
# Use this config to create a sandbox with Symphony pre-installed:
#   agentkernel create my-project --config examples/agents/symphony/agentkernel.toml

[sandbox]
name = "symphony-sandbox"

[build]
# Build from Dockerfile in this directory
dockerfile = "Dockerfile"

[resources]
vcpus = 2
memory_mb = 2048

[security]
profile = "moderate"
network = true      # Symphony needs network for Linear API and Codex
mount_cwd = true    # Mount project directory
