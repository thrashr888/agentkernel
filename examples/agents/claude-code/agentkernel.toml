# Claude Code Agent Configuration
# Copy this file and its Dockerfile into your project, then run:
#   agentkernel run --backend docker --config agentkernel.toml -- claude --version
#
# The configuration mounts this project at /workspace. It does not mount the
# host home or inject credentials. Start `claude` inside the guest to sign in;
# do not snapshot or export a guest after signing in.

[sandbox]
name = "claude-code-sandbox"

[build]
# Build from Dockerfile in this directory
dockerfile = "Dockerfile"

[agent]
preferred = "claude"
compatibility_mode = "claude"

[resources]
vcpus = 2
memory_mb = 1024

[security]
profile = "moderate"
network = true      # Claude Code needs network for API calls
mount_cwd = true    # Mount project directory
