# Remote Modal example

[sandbox]
name = "remote-modal"
base_image = "base"

[security]
mount_cwd = true
network = true

[network]
ports = ["3000"]

[remote]
bridge = "../../scripts/remote-bridge.mjs"

[remote.modal]
token_id_env = "MODAL_TOKEN_ID"
token_secret_env = "MODAL_TOKEN_SECRET"
project = "agentkernel"
